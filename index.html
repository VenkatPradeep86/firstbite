 ta:{whyshop:"கடை வகையால் பொருத்தப்பட்டது:",whynotable:"தனி Wikidata பதிவு வைக்கும் அளவு முக்கியமானது",whysince:"திறந்திருக்கிறது",warnlive:"இந்த உணவுக்கு Wikidata எந்த மூலத்தையும் பதிவு செய்யவில்லை, எனவே இது உள்ளூர் அல்ல, பிராந்தியமாகப் பட்டியலிடப்பட்டுள்ளது.",liveGap:"திறந்த தரவிலிருந்து நேரலையில் உருவாக்கப்பட்டது. ஒவ்வொரு உணவும் என்ன, எங்கிருந்து வந்தது என்பதை Wikidata பதிவு செய்யப்பட்ட உண்மைகளாகத் தீர்மானிக்கிறது, சொல் ஊகத்தால் அல்ல. கடைகள் OpenStreetMap-இலிருந்து, புகழ் அடையாளங்களால் வரிசைப்படுத்தப்பட்டவை, நற்பெயரால் அல்ல, ஏனெனில் எந்த உணவு எழுத்தும் படிக்கப்படவில்லை.",ver:"சரிபார்க்கப்பட்டது",one:"ஒரே ஆதாரம்",noshop:"எந்த ஆதாரமும் கடையைக் குறிப்பிடவில்லை",directions:"வழி",howver:"இது எப்படிச் சரிபார்க்கப்பட்டது",ver2:"இரு தனித்தனி ஆதாரங்கள் இதைக் குறிப்பிடுகின்றன.",ver1:"ஒரே ஆதாரம் மட்டும். நீங்களே முடிவு செய்யுங்கள்.",ver0:"சரிபார்க்கப்படவில்லை. முழுமைக்காக பட்டியலிடப்பட்டது.",opensrc:"ஆதாரத்தைத் திற",nowk:"புதிய நகரத்தின் நேரலைத் தேடலுக்கு v2 விவரக்குறிப்பின் Worker தேவை, அது இன்னும் இயங்கவில்லை. கீழுள்ள மூன்று தொகுப்புகள் ஆஃப்லைனில் வேலை செய்யும்.",greet:"வணக்கம். நீங்கள் எங்கே இருக்கிறீர்கள்?",say:"உங்கள் இருப்பிடத்தைப் பகிரவும், அல்லது எந்த நகரத்தின் பெயரையும் தட்டச்சு செய்யவும். ஆராய்ச்சி செய்யப்பட்ட தொகுப்பு இல்லாத நகரங்கள் நேரலையில் தேடப்படும்.",loc:"என் இருப்பிடத்தைப் பயன்படுத்து",tph:"எந்த நகரத்தின் பெயரும்",go:"செல்",or:"ஆராய்ச்சி செய்யப்பட்ட தொகுப்புகள்",lang:"மொழி",
  lnote:"உணவு மற்றும் கடைகளின் பெயர்கள் உள்ளூர் மொழியிலேயே இருக்கும், நீங்கள் அவற்றைச் சொல்ல வேண்டும்.",items:"சாப்பிட வேண்டியவை",

  srcH:"இந்த ஆதாரங்கள் பற்றி",cav:"எதுவும் நட்சத்திர மதிப்பீட்டின் அடிப்படையில் வரிசைப்படுத்தப்படவில்லை. நேரங்கள் OpenStreetMap-இலிருந்தும், தேர்வுக்குப் பிறகு செய்த தேடலிலிருந்தும் வருகின்றன, அவை மாறும். முன்பே அழைக்கவும்.",
  st1:"உள்ளூர் உணவு ஆதாரங்களைச் சேகரிக்கிறோம்",st2:"உணவுகளையும் கடைகளையும் பெறுகிறோம்",st3:"முடிவைத் தயாரிக்கிறோம்",
  noTrip:"இந்த நகரத்திற்கு இன்னும் பயண உணவுகள் இல்லை. பயணம் செய்ய எது தகுதியானது என்று நேரலைத் தேடல் தீர்மானிக்க முடியாது.",
  lfail:"இந்தப் பக்கத்திலிருந்து நேரலைத் தேடல் இணையத்தை அடைய முடியவில்லை. கோப்பு உங்கள் சொந்த டொமைனில் இருக்கும்போது இது வேலை செய்யும், அங்கு உலாவி OpenStreetMap மற்றும் Wikipedia-வை அழைக்க முடியும்.",
  lnone:"அந்தப் பெயருக்கு சாப்பிடக்கூடியது எதுவும் வரவில்லை. எழுத்துப்பிழையைச் சரிபார்க்கவும், அல்லது அருகிலுள்ள பெரிய நகரத்தை முயற்சிக்கவும்.",lback:"திரும்பு"},
 te:{whyshop:"దుకాణం రకం ఆధారంగా జత:",whynotable:"సొంత Wikidata నమోదు ఉండేంత ప్రముఖం",whysince:"తెరిచి ఉంది",warnlive:"ఈ వంటకానికి Wikidata ఎలాంటి మూలాన్ని నమోదు చేయలేదు, కాబట్టి ఇది స్థానికం కాక ప్రాంతీయంగా చేర్చబడింది.",liveGap:"బహిరంగ డేటా నుండి ప్రత్యక్షంగా రూపొందించబడింది. ప్రతి వంటకం ఏమిటి, ఎక్కడి నుండి వచ్చింది అనేది Wikidata నమోదైన వాస్తవాలుగా నిర్ణయిస్తుంది, పదాల ఊహతో కాదు. దుకాణాలు OpenStreetMap నుండి, ప్రముఖత సంకేతాల ఆధారంగా వరుసలో, పేరు ప్రఖ్యాతుల ఆధారంగా కాదు.",ver:"ధృవీకరించబడింది",one:"ఒకే మూలం",noshop:"ఏ మూలమూ దుకాణం పేరు చెప్పలేదు",directions:"దారి",howver:"ఇది ఎలా పరిశీలించబడింది",ver2:"రెండు స్వతంత్ర మూలాలు దీన్ని పేర్కొంటాయి.",ver1:"ఒకే మూలం. మీరే అంచనా వేయండి.",ver0:"ధృవీకరించలేదు. సంపూర్ణత కోసం చేర్చాము.",opensrc:"మూలాన్ని తెరువు",nowk:"కొత్త నగరం ప్రత్యక్ష అన్వేషణకు v2 స్పెసిఫికేషన్ Worker అవసరం, అది ఇంకా అమలులో లేదు. కింది మూడు ప్యాక్‌లు ఆఫ్‌లైన్‌లో పనిచేస్తాయి.",greet:"నమస్కారం. మీరు ఎక్కడ ఉన్నారు?",say:"మీ లొకేషన్ షేర్ చేయండి, లేదా ఏ నగరం పేరైనా టైప్ చేయండి. పరిశోధించిన ప్యాక్ లేని నగరాలు ప్రత్యక్షంగా వెతకబడతాయి.",loc:"నా లొకేషన్ ఉపయోగించు",tph:"ఏ నగరం పేరైనా",go:"వెళ్లు",or:"పరిశోధించిన ప్యాక్‌లు",lang:"భాష",
  lnote:"వంటకాలు మరియు దుకాణాల పేర్లు స్థానిక భాషలోనే ఉంటాయి, మీరు వాటిని పలకాలి.",items:"తినాల్సిన వస్తువులు",

  srcH:"ఈ మూలాల గురించి",cav:"ఏదీ స్టార్ రేటింగ్‌ల ఆధారంగా వరుసలో పెట్టలేదు. సమయాలు OpenStreetMap నుండి మరియు ఎంపిక తర్వాత చేసిన అన్వేషణల నుండి వస్తాయి, అవి మారుతాయి. ముందే ఫోన్ చేయండి.",
  st1:"స్థానిక ఆహార మూలాలను సేకరిస్తున్నాము",st2:"వంటకాలు మరియు దుకాణాలు తెస్తున్నాము",st3:"ఫలితం సిద్ధం చేస్తున్నాము",
  noTrip:"ఈ నగరానికి ఇంకా ప్రయాణ వంటకాలు లేవు. ప్రయాణించదగినది ఏదో ప్రత్యక్ష అన్వేషణ నిర్ణయించలేదు.",

   {d:"Linzer Augen",vn:"Linzer Augen",cat:"Pastry",tier:"",veg:1,seas:"Christmas",months:[10,11],place:"Konditorei Bienchen",addr:"Sonnenallee 122, 1220 Wien",what:"Jam sandwich biscuits with holes cut through the lid. A Christmas-tin fixture.",why:"Named by both sources.",src:1,alts:[]},
   {d:"Zimtschnecken",vn:"Zimtschnecken",cat:"Pastry",tier:"",veg:1,place:"Omas Café",addr:"Obere Augartenstraße 70, 1020 Wien",what:"Cinnamon buns baked with organic spelt. Vegan and gluten-free options.",why:"Named in the Konditorei survey.",src:1,alts:[]}]},

 steyr:{name:"Steyr",aka:["steyr","stayr","steier"],lat:48.0405,lng:14.4212,
  sources:[
   {n:"Schwarz auf Weiss, Steyr Mehlspeisenrundgang",k:"German travel journalism",
    b:"A long-form pastry walk through Steyr that names each shop, its owner and the building it sits in, rather than listing addresses.",
    note:"It is the only source found that documents the Steyrer Torte, the Froschel and the Schnalle at all. Everything city-exclusive in this pack comes from it.",
    u:"https://www.schwarzaufweiss.de/oesterreich/steyr-kulinarisch.htm"},
   {n:"Oberösterreich Tourismus",k:"Official regional tourism board",
    b:"The province's own kitchen pages, where each regional recipe is credited to a specific named restaurant rather than written anonymously.",
    note:"That crediting is why Knapp am Eck appears here: the board picked one kitchen in the whole province as its Grammelknödel source.",
    u:"https://www.oberoesterreich.at/kulinarik/rezepte/spezialitaeten-aus-oesterreich-typische-rezepte-aus-oberoesterreich.html"},
   {n:"Local word of mouth",k:"Unverified, included on request",
    b:"One entry here comes from local recommendation rather than published food writing, and is marked Locals' pick.",
    note:"It is not an Austrian speciality and does not belong in the canon, but people in Steyr rate it, which is its own kind of useful.",
    u:""}],
  gap:"Two published sources, which is what a city of 38,000 yields. MeinBezirk's local Geheimtipps column was identified as a third but not read. The sweet side is far better covered than the savoury side, and that imbalance sits in the sources, not in the ranking.",
  items:[
   {d:"Steyrer Torte",vn:"Steyrer Torte",cat:"Cake",tier:"must",veg:1,only:1,place:"Café Konditorei Schmidt",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg",addr:"Stadtplatz 1, 4400 Steyr",
    what:"Chocolate torte with nuts and redcurrant jam on shortcrust, at 70 percent cocoa. Sold in a box printed with the confluence of the Steyr and the Enns.",
    order:"A slice in the café, or the whole torte boxed to carry.",
    why:"Invented by the current owner about fifteen years ago. The Schmidt family has held the house 85 years and is in its third generation. The name is unprotected, so any confectioner may make one, but this is where it started.",
    warn:"Closed Monday and Sunday.",src:1,alts:[]},
   {d:"Froschel",vn:"Froschel / Froscherl",cat:"Cake",tier:"must",veg:1,only:1,place:"Café Konditorei Schmidt",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg",addr:"Stadtplatz 1, 4400 Steyr",
    what:"A violently green sand-cake with cherry buttercream under sugar fondant. The colour is the point and it is not subtle.",
    order:"Ask by name. It is a local word, not a menu category.",why:"The current owner's grandfather brought the idea back from Wiesbaden and France. Found nowhere outside Steyr.",
    warn:"Closed Monday and Sunday.",src:1,alts:[]},
   {d:"Steyrer Schnalle",vn:"Steyrer Schnalle",cat:"Sweet",tier:"must",veg:1,only:1,place:"Bäckerei Fröhlich, Lebzelterhaus",pid:"ChIJfaez4_jFc0cRzgrXFFyFzgI",addr:"Kirchengasse 20, Steyrdorf",
    what:"A chocolate taler of marzipan, dark chocolate and Dirndl jam, made from cornelian cherries. Named for the toll once charged at the Schnallentor.",
    order:"Ask at the counter by name.",
    why:"Made by master baker Rainer Fröhlich in the Lebzelterhaus, a building going back to the 16th century where wax candles were drawn and Lebkuchen baked. A city exclusive named after a city gate.",
    warn:"The map pin may land on the Stadtplatz 28 branch. The Lebzelterhaus is Kirchengasse 20. Check before walking.",src:1,alts:[]},
   {d:"Essbare Dachschindeln",vn:"essbare Dachschindeln",cat:"Snack",tier:"must",veg:1,only:1,place:"Bäckerei Fröhlich, Lebzelterhaus",pid:"ChIJfaez4_jFc0cRzgrXFFyFzgI",addr:"Kirchengasse 20, Steyrdorf",
    what:"Edible roof shingles. A savoury oval crispbread, long and curved like the shingles on the old town roofs.",
    order:"Savoury, not sweet. Better with beer than coffee.",why:"Rainer Fröhlich's own invention, sold nowhere else.",
    warn:"The pin may show the Stadtplatz branch rather than the Lebzelterhaus.",src:1,alts:[]},
   {d:"Grammelknödel",vn:"Grammelknödel",cat:"Dumpling",tier:"must",veg:0,place:"Wirtshaus Knapp am Eck",pid:"ChIJ1YyynPnFc0cRzUhd1EYZ3nA",addr:"Wehrgrabengasse 15, 4400 Steyr",
    what:"Potato-dough dumplings filled with Grammeln, the crisp scratchings left after rendering lard. Usually with sauerkraut.",
    order:"The menu runs to one page, which makes choosing fast.",
    why:"The provincial tourism board credits its Grammelknödel recipe to this kitchen specifically, which is a whole province singling out one house.",
    warn:"Closed Monday and Sunday, and shut between 14:00 and 18:00.",src:1,alts:[]},
   {d:"Schweinsbratl mit Knödel und Stöcklkraut",vn:"Schweinsbratl",cat:"Main",tier:"must",veg:0,place:"Schwechaterhof",pid:"ChIJG9FBX_bFc0cRsm_jcLA2snk",addr:"Leopold-Werndl-Straße 1, 4400 Steyr",reg:"Upper Austrian",
    what:"Roast pork with dumplings and Stöcklkraut, cabbage cut into blocks rather than shredded. The regional Sunday plate.",
    order:"The house leans on its beer list as hard as its kitchen.",why:"Named by the provincial board as a regional signature, and this is the Wirtshaus the Steyr source attaches to it.",
    warn:"Closed Monday. Sunday only until 14:00.",src:2,
    alts:[{n:"Wirtshaus Knapp am Eck",d:"Wehrgrabengasse 15. Closed Mon and Sun.",pid:"ChIJ1YyynPnFc0cRzUhd1EYZ3nA"}]},
   {d:"Döner Kebab",vn:"Döner",cat:"Snack",tier:"must",veg:0,local:1,place:"Pizza & Imbiss Colosseo",pid:"ChIJW5nVw1fPc0cRyt2YMGEYznU",addr:"Bahnhofstraße 2, 4400 Steyr",
    what:"A five euro döner on bread baked in house, in portions reviewers describe as two meals. Turkish, not Austrian, and nothing to do with the local canon.",
    order:"Cash only. Eat in or take away, inside and outside seating.",
    why:"Included because people in Steyr rate it, not because any food writer does. It is also the practical answer to the real Steyr problem: on a Sunday evening, when both Konditoreien and both Wirtshäuser are shut, this is open until 22:00.",
    warn:"Cash only. Word of mouth, not published food writing, so treat the claim as unverified. Several reviewers find the service brusque.",alts:[]},
   {d:"Trappistenbier Gregorius",vn:"Gregorius, Stift Engelszell",cat:"Drink",tier:"worth",veg:1,place:"Schwechaterhof",pid:"ChIJG9FBX_bFc0cRsm_jcLA2snk",addr:"Leopold-Werndl-Straße 1, 4400 Steyr",reg:"Upper Austrian",
    what:"Trappist beer at 9.7 percent from Stift Engelszell, the only Trappist brewery in Austria. Benno, at 9 percent, sits beside it.",
    order:"One is a commitment. The house also pours Hofstetten's Granitbier and unfiltered Aurora Dolde.",
    why:"The Steyr source singles this house out for its beer rather than its food.",warn:"Closed Monday.",src:1,alts:[]},
   {d:"Mandelkipferl",vn:"Mandelkipferl",cat:"Pastry",tier:"worth",veg:1,place:"Bäckerei Fröhlich, Lebzelterhaus",pid:"ChIJfaez4_jFc0cRzgrXFFyFzgI",addr:"Kirchengasse 20, Steyrdorf",
    what:"Almond crescents, eaten standing with coffee. The counter also runs to Ischler Plätzchen and Topfentorte.",
    order:"You can watch the baker work from the café.",why:"Named among the Fröhlich range.",warn:"Saturday closes at noon. Closed Sunday.",src:1,alts:[]},
   {d:"Punschkrapferl",vn:"Punschkrapferl",cat:"Pastry",tier:"worth",veg:1,place:"Café Konditorei Schmidt",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg",addr:"Stadtplatz 1, 4400 Steyr",what:"Sponge, jam, rum and chocolate. The local spelling takes the diminutive.",why:"Named by the Steyr source.",warn:"Closed Mon and Sun.",src:1,alts:[]},
   {d:"Granitbier",vn:"Granitbier",cat:"Drink",tier:"worth",veg:1,place:"Schwechaterhof",pid:"ChIJG9FBX_bFc0cRsm_jcLA2snk",addr:"Leopold-Werndl-Straße 1, 4400 Steyr",reg:"Upper Austrian",what:"Brewed by Hofstetten and fermented in granite vats, which is the whole conceit.",why:"Named by the Steyr source.",src:1,alts:[]},
   {d:"Lebkuchen",vn:"Lebkuchen",cat:"Sweet",tier:"worth",veg:1,place:"Bäckerei Fröhlich, Lebzelterhaus",pid:"ChIJfaez4_jFc0cRzgrXFFyFzgI",addr:"Kirchengasse 20, Steyrdorf",what:"Spiced honey cake. The Lebzelterhaus is named for the trade: Lebzelter made the gingerbread and the wax.",why:"The building's own history.",src:1,alts:[]},
   {d:"Ischler Plätzchen",vn:"Ischler Plätzchen",cat:"Pastry",tier:"",veg:1,place:"Bäckerei Fröhlich, Lebzelterhaus",pid:"ChIJfaez4_jFc0cRzgrXFFyFzgI",addr:"Kirchengasse 20, Steyrdorf",reg:"Bad Ischl",what:"Two shortcrust discs with jam between, coated in chocolate. From Bad Ischl, across the province.",why:"Named by the Steyr source.",src:1,alts:[]},
   {d:"Topfentorte",vn:"Topfentorte",cat:"Cake",tier:"",veg:1,place:"Bäckerei Fröhlich, Lebzelterhaus",pid:"ChIJfaez4_jFc0cRzgrXFFyFzgI",addr:"Kirchengasse 20, Steyrdorf",what:"Baked quark torte.",why:"Named by the Steyr source.",src:1,alts:[]},
   {d:"Maroni-Kirschtorte",vn:"Maroni-Kirschtorte",cat:"Cake",tier:"",veg:1,seas:"Autumn",months:[8,9,10],place:"Café Konditorei Schmidt",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg",addr:"Stadtplatz 1, 4400 Steyr",what:"Chestnut and cherry torte.",why:"Named by the Steyr source.",src:1,alts:[]},
   {d:"Marzipankartofferl",vn:"Marzipankartofferl",cat:"Sweet",tier:"",veg:1,place:"Café Konditorei Schmidt",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg",addr:"Stadtplatz 1, 4400 Steyr",what:"Cocoa-dusted marzipan, in the local diminutive spelling.",why:"Named by the Steyr source.",src:1,alts:[]},
   {d:"Callebaut-Trüffel",vn:"Trüffel",cat:"Sweet",tier:"",veg:1,place:"Café Konditorei Schmidt",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg",addr:"Stadtplatz 1, 4400 Steyr",what:"Chocolate truffles made on Callebaut couverture.",why:"Named by the Steyr source.",src:1,alts:[]},
   {d:"Sachertorte",vn:"Sachertorte",cat:"Cake",tier:"",veg:1,place:"Bäckerei Fröhlich, Lebzelterhaus",pid:"ChIJfaez4_jFc0cRzgrXFFyFzgI",addr:"Kirchengasse 20, Steyrdorf",reg:"Viennese",what:"The Vienna cake, made locally.",why:"Named at both Steyr houses.",src:1,
    alts:[{n:"Café Konditorei Schmidt",d:"Stadtplatz 1. Also makes one.",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg"}]},
   {d:"Mozarttorte",vn:"Mozarttorte",cat:"Cake",tier:"",veg:1,place:"Café Konditorei Schmidt",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg",addr:"Stadtplatz 1, 4400 Steyr",reg:"Salzburg",what:"Marzipan, pistachio and nougat, after the Salzburg sweet.",why:"Named by the Steyr source.",src:1,alts:[]},
   {d:"Adventsschnitte",vn:"Adventsschnitte",cat:"Cake",tier:"",veg:1,seas:"December only",months:[11],place:"Café Konditorei Schmidt",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg",addr:"Stadtplatz 1, 4400 Steyr",what:"Lebkuchen base with Powidl, the thick unsweetened plum butter. Christmas only.",why:"Named as a seasonal line.",src:1,alts:[]},
   {d:"Osterpinze",vn:"Osterpinze",cat:"Bread",tier:"",veg:1,seas:"Easter only",months:[2,3],place:"Bäckerei Fröhlich, Lebzelterhaus",pid:"ChIJfaez4_jFc0cRzgrXFFyFzgI",addr:"Kirchengasse 20, Steyrdorf",what:"Sweet yeast bread snipped into three peaks, eaten at Easter.",why:"Named among the Easter range.",src:1,alts:[]},
   {d:"Dinkelroulade",vn:"Dinkelroulade",cat:"Cake",tier:"",veg:1,seas:"Seasonal",place:"Bäckerei Fröhlich, Lebzelterhaus",pid:"ChIJfaez4_jFc0cRzgrXFFyFzgI",addr:"Kirchengasse 20, Steyrdorf",what:"Spelt roulade.",why:"Named by the Steyr source.",src:1,alts:[]},
   {d:"Erdbeerkaramelltorte",vn:"Erdbeerkaramelltorte",cat:"Cake",tier:"",veg:1,seas:"Summer",months:[4,5,6],place:"Café Konditorei Schmidt",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg",addr:"Stadtplatz 1, 4400 Steyr",what:"Strawberry and caramel torte.",why:"Named by the Steyr source.",src:1,alts:[]},
   {d:"Linzer Torte",vn:"Linzer Torte",cat:"Cake",tier:"trip",veg:1,placeTxt:"Linz, about 40 km. 25 minutes by train.",
    what:"Redcurrant jam under a nut-shortcrust lattice, from the provincial capital. Claimed as the oldest cake with a surviving written recipe.",
    order:"Every Linz Konditorei makes one. Compare two.",warn:"No source here named a specific Linz shop. Unverified.",why:"Regional classic named by the board.",src:1,alts:[]},
   {d:"Schwarzbeernocken",vn:"Schwarzbeernocken",cat:"Dessert",tier:"trip",veg:1,seas:"Bilberry season",months:[6,7,8],place:"Konditorei Zauner",addr:"Bad Ischl, about 90 km",
    what:"Sweet dumplings full of wild bilberries, from an old recipe of the Zauner house.",order:"Zauner is also named for iced Kaiserschmarrn and fried apple rings.",why:"The board credits the recipe to Zauner.",src:1,alts:[]},
   {d:"Bratl in der Rein",vn:"Bratl in der Rein",cat:"Main",tier:"trip",veg:0,place:"Steegwirt",addr:"Bad Goisern, about 95 km",what:"Roast brought to the table in the pan it was cooked in.",why:"The board shows the dish at Steegwirt.",src:1,alts:[]},
   {d:"Mühlviertler Rahmsuppe",vn:"Mühlviertler Rahmsuppe",cat:"Soup",tier:"trip",veg:1,place:"Schmankerlwirt",addr:"Vorderweißenbach, about 110 km",what:"Cream soup from the Mühlviertel, the granite upland north of the Danube.",why:"Recipe credited by the board.",src:1,alts:[]},
   {d:"Leinölerdäpfel",vn:"Leinölerdäpfel",cat:"Side",tier:"trip",veg:1,place:"Kulinarium Vonwiller",addr:"Haslach, about 120 km",what:"Potatoes with linseed oil and curd. Mühlviertel linseed oil is the regional signature.",why:"Recipe credited by the board.",src:1,alts:[]},
   {d:"Mohnflesserl",vn:"Mohnflesserl",cat:"Bread",tier:"trip",veg:1,place:"Bäckerei Brandl",addr:"Upper Austria",what:"Plaited poppy-seed roll. The board publishes the original recipe with the braiding method.",why:"Credited by the board to Brandl.",src:1,alts:[]},
   {d:"Eierschwammerlgulasch",vn:"Eierschwammerlgulasch",cat:"Main",tier:"trip",veg:1,seas:"Summer to early autumn",months:[6,7,8,9],place:"Restaurant Waldschänke",addr:"Grieskirchen, about 90 km",what:"Chanterelle goulash with bread dumplings.",why:"Recipe credited by the board.",src:1,alts:[]},
   {d:"Leberschädel",vn:"Leberschädel",cat:"Main",tier:"trip",veg:0,place:"Gasthof Haudum",addr:"Helfenberg, about 125 km",what:"A liver speciality with parsley potatoes and bacon-cabbage salad.",why:"Recipe credited by the board.",src:1,alts:[]},
   {d:"Überbackene Speckknödel",vn:"überbackene Speckknödel",cat:"Dumpling",tier:"trip",veg:0,place:"Hoftaverne Atzmüller",addr:"Waxenberg, about 115 km",what:"Bacon dumplings, gratinated.",why:"Recipe credited by the board.",src:1,alts:[]},
   {d:"Knusprige Weidegans",vn:"Weidegans",cat:"Main",tier:"trip",veg:0,seas:"Late Oct to Nov",months:[9,10],place:"Keplingerwirt",addr:"St Johann im Mühlkreis, about 110 km",what:"Pasture-raised roast goose with dumplings, the Martini season dish.",why:"Recipe credited by the board.",src:1,alts:[]},
   {d:"Batzlguglhupf",vn:"Batzlguglhupf",cat:"Cake",tier:"trip",veg:1,place:"Konditorei Schörgi",addr:"Grein, about 65 km",what:"A Gugelhupf variant from the Danube town of Grein.",why:"Recipe credited by the board.",src:1,alts:[]},
   {d:"Holzknechtnocken",vn:"Holzknechtnocken",cat:"Dessert",tier:"trip",veg:1,placeTxt:"Salzkammergut, no shop named",what:"An old dish of the Holzknechte, the forest woodsmen.",warn:"No shop named by any source here.",why:"Named by the board with a home recipe only.",src:1,alts:[]}]},

 tirunelveli:{name:"Tirunelveli",aka:["tirunelveli","thirunelveli","nellai","tinnevelly","திருநெல்வேலி"],lat:8.7139,lng:77.7567,
  sources:[
   {n:"Wikipedia, Iruttu Kadai",k:"Encyclopaedia, provenance only",
    b:"Confirms the hard facts behind the city's one genuine exclusive: the shop opened in 1900, has never expanded, and sells a wheat, sugar and ghee halwa.",
    note:"It is thin. It does not give hours, the current owner, or the method, so the practical detail here comes from a maps lookup instead.",
    u:"https://en.wikipedia.org/wiki/Iruttu_Kadai"},
   {n:"Chennai Orbit, Top 10 Foods in Tirunelveli",k:"Regional listicle, weak",
    b:"A city food list that names shops for each dish, which is more than most English-language writing on Tirunelveli manages.",
    note:"Its quality is well below the Austrian sources. Half its entries are pan-Tamil staples like dosai and sambar that are not specific to Tirunelveli at all, and those sit in Overall here rather than Must try.",
    u:"https://chennaiorbit.com/blog/top-10-foods-to-try-in-tirunelveli/"}],
  gap:"This pack is noticeably weaker than Vienna's or Steyr's and should be treated as a first draft. The halwa is solid and well documented. Everything else rests on one listicle plus hours from a maps lookup. Tamil-language food writing, which exists in Dinamalar and Vikatan, would change this list and has not been read.",
  items:[
   {d:"Tirunelveli Halwa",vn:"திருநெல்வேலி அல்வா",cat:"Sweet",tier:"must",veg:1,only:1,place:"Iruttukadai Halwa Shop",pid:"ChIJxRuGp3wRBDsRF1P7_UlG8sg",addr:"13A Kizhakku Ratha Street, Tirunelveli Junction",
    what:"Wheat halwa cooked down with sugar and ghee until it is translucent and holds a spoon mark. Locally credited to the water of the Thamirabarani, which is why the version made elsewhere is never quite the same.",
    order:"Sold by weight, served on a leaf. Cash only at the main counter.",
    why:"Iruttu Kadai means dark shop. It opened in 1900 and has never expanded or opened a second branch, which is the whole claim.",
    warn:"Open five hours a day, 17:00 to 22:00. The queue at 17:00 is long and reviewers say it clears by 19:00. Cash only here, though the neighbouring Visakam counter takes GPay.",src:2,
    alts:[{n:"Chandra Sweets",d:"167 Swami Nellaiappar High Rd, below the double-decker bridge. Locals rate it above Iruttukadai and it opens 10:15 to 22:30.",pid:"ChIJnWuDCgkRBDsR3LzQOZKWnZw"},
          {n:"Lakshmi Vilas",d:"27 Madurai Rd. Open 24 hours, and does a paal halwa as well.",pid:"ChIJQ3-BnIURBDsR9ArfN7xPwUM"}]},
   {d:"Palaya Soru",vn:"பழைய சோறு",cat:"Rice",tier:"must",veg:0,place:"D Parottaz",pid:"ChIJfSDV7TUTBDsRklIwGN2MzIg",addr:"17/2 First Cross Street, NGO Colony",
    what:"Rice left overnight in water to ferment, eaten cold with onion, chilli and curd. Farm food that almost never appears on a restaurant menu.",
    order:"Reviewers pair it with prawn or mutton. Ask whether it is on today.",
    why:"A reviewer calls this the only place in Tirunelveli serving it, which is the kind of claim worth going to check.",
    warn:"Single-review claim, not published food writing. Unverified.",src:1,alts:[]},
   {d:"Nool Parotta",vn:"நூல் பரோட்டா",cat:"Bread",tier:"must",veg:0,place:"D Parottaz",pid:"ChIJfSDV7TUTBDsRklIwGN2MzIg",addr:"17/2 First Cross Street, NGO Colony",
    what:"Parotta pulled into threads rather than layers, so it shreds instead of flaking. Eaten with dry spiced gravies.",
    order:"This kitchen refuses to serve salna at all and is proud of it, so do not ask for the usual gravy.",
    why:"Named for the nool parotta specifically, and the no-salna rule makes it a deliberate house style rather than a default.",src:1,
    alts:[{n:"Udhaya Vilas",d:"NH 44, KTC Nagar roundabout. Parotta with salna, the conventional way.",pid:"ChIJEdzmaS8NBDsRPQM10SGtRyc"}]},
   {d:"Idiyappam",vn:"இடியாப்பம்",cat:"Tiffin",tier:"must",veg:1,placeTxt:"Srinivasa Idiyappam, or Hotel Ashok",
    what:"Rice flour pressed into fine strands and steamed in nests. Eaten with sweetened coconut milk in the morning or with a spiced curry.",
    order:"Ask for coconut milk if you want it the sweet way.",why:"Both shops are named for it, though neither source gives a street address.",
    warn:"No address or hours found for either shop. Unverified.",src:1,alts:[]},
   {d:"Kadalai Sundal",vn:"கடலை சுண்டல்",cat:"Snack",tier:"worth",veg:1,placeTxt:"Stalls around Nellaiappar Temple and Tirunelveli Junction",
    what:"Chickpeas or peanuts boiled and tossed with grated coconut, mustard seed and curry leaf. Served in a paper cone for a few rupees.",
    order:"Temple stalls, late afternoon onward. Eaten walking.",why:"Named as temple-adjacent street food rather than restaurant food.",
    warn:"Street stalls move. A pin would be the temple, not a shop.",src:1,alts:[]},
   {d:"Paal Halwa",vn:"பால் அல்வா",cat:"Sweet",tier:"worth",veg:1,place:"Lakshmi Vilas",pid:"ChIJQ3-BnIURBDsR9ArfN7xPwUM",addr:"27 Madurai Rd, near the railway station",
    what:"The milk version of the halwa, paler and softer than the wheat one, and usually about half again the price.",
    order:"Reviewers single out the paal halwa here specifically.",why:"One of the older halwa houses, on the road to the station, and the only one open around the clock.",src:1,alts:[]},
   {d:"Paal Ice Cream",vn:"பால் ஐஸ்",cat:"Dessert",tier:"worth",veg:1,placeTxt:"Sold alongside halwa at most Tirunelveli halwa shops",
    what:"Milk ice, barely flavoured, sold beside the halwa counters as the thing you eat while the halwa is wrapped.",order:"Ask at the halwa counter rather than looking for a separate shop.",
    why:"Named as a halwa-shop fixture rather than a dessert parlour item.",warn:"No single shop named. Unverified.",src:1,alts:[]},
   {d:"Vatha Kuzhambu",vn:"வத்த குழம்பு",cat:"Main",tier:"worth",veg:1,place:"Hotel Ponnusamy",addr:"Tirunelveli",
    what:"Tamarind gravy darkened with sun-dried vegetables and a lot of pepper, poured over rice. Sour, hot and built to keep.",order:"Eaten with plain rice and sesame oil.",why:"Named for home-style cooking.",src:1,alts:[]},

/* ═══════════════════════════════════════════════════════════════════════
   LIVE LOOKUP v3 — no key, no account, no server, no AI.

   v1 guessed with keyword lists and called Idli a cake. v2 was going to
   ask a model to read. v3 does neither: it asks WIKIDATA, where humans
   have already recorded what kind of food a dish is and where it comes
   from, as structured facts.

     food type   <- P31  "instance of"        (was: 13 keyword lists)
     exclusivity <- P495 "country of origin"
                    P1071 "location of creation"
                    P138  "named after"       (was: city name in the title)

   Four public endpoints, all CORS-open and keyless:
     nominatim.openstreetmap.org   place name  -> coordinates
     <lang>.wikipedia.org/w/api.php  which dishes exist in this cuisine
     query.wikidata.org/sparql     what each dish IS, and where it is from
     overpass-api.de               shops near the coordinates
   ═══════════════════════════════════════════════════════════════════════ */

const NOM="https://nominatim.openstreetmap.org/search";
const WDQ="https://query.wikidata.org/sparql";
const OVP=["https://overpass-api.de/api/interpreter","https://overpass.private.coffee/api/interpreter"];
const wpApi=lang=>"https://"+lang+".wikipedia.org/w/api.php";

async function jget(url,ms,hdr){
  const c=new AbortController(), tm=setTimeout(()=>c.abort(),ms||12000);
  try{const r=await fetch(url,{signal:c.signal,headers:hdr||{Accept:"application/json"}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    return await r.json();}
  finally{clearTimeout(tm);}
}
async function opost(body){
  let last=null;
  for(const ep of OVP){
    const c=new AbortController(), tm=setTimeout(()=>c.abort(),40000);
    try{const r=await fetch(ep,{method:"POST",signal:c.signal,body:"data="+enc(body),
        headers:{"Content-Type":"application/x-www-form-urlencoded"}});
      if(r.status===429||r.status===504){last=new Error("busy");continue;}
      if(!r.ok)throw new Error("HTTP "+r.status);
      return await r.json();}
    catch(e){last=e}finally{clearTimeout(tm)}
  }
  throw last||new Error("unreachable");
}

/* ── 1. place name -> a place record ── */
async function geo(q){
  const j=await jget(NOM+"?format=jsonv2&addressdetails=1&limit=1&accept-language=en&q="+enc(q),12000);
  if(!j||!j.length)return null;
  const a=j[0], ad=a.address||{};
  return{name:a.name||q,lat:+a.lat,lon:+a.lon,display:a.display_name||q,
    country:ad.country||"",cc:(ad.country_code||"").toLowerCase(),
    state:ad.state||ad.region||"",district:ad.county||ad.state_district||""};
}

/* Which Wikipedia language edition knows this region best. */
const LANG_BY_CC={at:"de",de:"de",ch:"de",fr:"fr",it:"it",es:"es",pt:"pt",nl:"nl",pl:"pl",
  jp:"ja",cn:"zh",kr:"ko",ru:"ru",tr:"tr",gr:"el",se:"sv",no:"no",dk:"da",fi:"fi",cz:"cs",hu:"hu",ro:"ro"};
const LANG_BY_STATE={"tamil nadu":"ta","andhra pradesh":"te","telangana":"te","kerala":"ml",
  "karnataka":"kn","maharashtra":"mr","west bengal":"bn","gujarat":"gu","punjab":"pa","odisha":"or"};
function wikiLangs(g){
  const out=["en"];
  const s=(g.state||"").toLowerCase();
  if(LANG_BY_STATE[s])out.push(LANG_BY_STATE[s]);
  else if(LANG_BY_CC[g.cc])out.push(LANG_BY_CC[g.cc]);
  return out;
}

/* ── 2. which dishes belong to this region ── */
async function findCategory(lang,probe){
  try{
    const cs=await jget(wpApi(lang)+"?action=query&list=search&srnamespace=14&srlimit=5&format=json&origin=*&srsearch="+enc(probe+" cuisine"),12000);
    const hits=((cs.query||{}).search||[]).map(x=>x.title)
      .filter(x=>/cuisine|dish|dessert|food|küche|料理|खाना|உணவு|వంటకాలు/i.test(x));
    return hits[0]||null;
  }catch(e){return null}
}
async function categoryMembers(lang,cat,depth,seen,out,subs){
  const cm=await jget(wpApi(lang)+"?action=query&list=categorymembers&cmtype=page%7Csubcat&cmlimit=300&format=json&origin=*&cmtitle="+enc(cat),14000);
  ((cm.query||{}).categorymembers||[]).forEach(m=>{
    if(m.ns===14){ if(depth<1&&subs.length<6&&/cuisine|dish|dessert|bread|cake|sweet|pastr|soup|drink|snack/i.test(m.title)&&subs.indexOf(m.title)<0)subs.push(m.title); }
    else if(!seen[m.title]){seen[m.title]=1;out.push(m.title);}
  });
}

/* ── 3. THE PART THAT REPLACES EVERY KEYWORD LIST ──
   One SPARQL query asks Wikidata what each dish IS and where it is FROM. */
async function wikidataFacts(lang,titles){
  const vals=titles.slice(0,160).map(t=>'"'+t.replace(/"/g,'').replace(/\\/g,'')+'"@'+lang).join(" ");
  const q=`SELECT ?name ?typeLabel ?originLabel ?namedLabel ?desc WHERE {
  VALUES ?name { ${vals} }
  ?sitelink schema:about ?item ; schema:isPartOf <https://${lang}.wikipedia.org/> ; schema:name ?name .
  OPTIONAL { ?item wdt:P31 ?type }
  OPTIONAL { ?item wdt:P1071 ?origin }
  OPTIONAL { ?item wdt:P495 ?origin }
  OPTIONAL { ?item wdt:P138 ?named }
  OPTIONAL { ?item schema:description ?desc FILTER(LANG(?desc)="en") }
  SERVICE wikibase:label { bd:serviceParam wikibase:language "en,${lang}". }
}`;
  const j=await jget(WDQ+"?format=json&query="+enc(q),30000,{Accept:"application/sparql-results+json"});
  const by={};
  ((j.results||{}).bindings||[]).forEach(b=>{
    const n=b.name&&b.name.value; if(!n)return;
    const e=by[n]||(by[n]={types:[],origins:[],named:[],desc:""});
    const push=(arr,v)=>{if(v&&v.value&&arr.indexOf(v.value)<0&&!/^Q\d+$/.test(v.value))arr.push(v.value);};
    push(e.types,b.typeLabel); push(e.origins,b.originLabel); push(e.named,b.namedLabel);
    if(b.desc&&!e.desc)e.desc=b.desc.value;
  });
  return by;
}

/* Food type straight from Wikidata's "instance of", tidied for display.
   No keyword list. If Wikidata is silent we say so rather than guess.   */
const TYPE_TIDY=[
  /* word boundaries matter: without them "steamed" contains "tea" and Idli
     comes out as a Drink. Same class of bug as v1, caught by the test. */
  [/\b(dessert|sweet|sweets|confection|candy|halwa|pudding)\b/i,"Sweet"],
  /* rice is tested BEFORE cake: Wikidata calls Idli a "rice cake" and it is
     a rice dish, not a cake. This line is the v1 bug, inverted. */
  [/\b(rice|biryani|pulao|pilaf|risotto)\b/i,"Rice"],
  [/\b(cake|torte|gateau|tart|pastry|pie)\b/i,"Cake"],
  [/\b(bread|flatbread|roti|loaf|bun)\b/i,"Bread"],
  [/\b(soup|stew|broth)\b/i,"Soup"],
  [/\b(beverage|drink|beer|wine|juice|coffee|tea|cider)\b/i,"Drink"],
  [/\b(dumpling|dumplings)\b/i,"Dumpling"],
  [/\b(noodle|noodles|pasta)\b/i,"Noodles"],
  [/\b(snack|fritter)\b/i,"Snack"],
  [/\b(breakfast|tiffin|porridge)\b/i,"Breakfast"],
  [/\b(sauce|chutney|pickle|condiment)\b/i,"Condiment"],
  [/\b(salad)\b/i,"Salad"],
  [/\b(cheese|dairy)\b/i,"Dairy"],
  [/\b(meat|sausage|poultry|fish|seafood)\b/i,"Meat and fish"]];
function typeFrom(facts){
  if(!facts||!facts.types.length)return null;
  /* prefer the most specific statement Wikidata makes, not the first */
  const raw=facts.types.slice().sort((a,b)=>b.length-a.length);
  for(const r of raw){ for(const [re,label] of TYPE_TIDY){ if(re.test(r))return label; } }
  const w=raw[0];
  return w.charAt(0).toUpperCase()+w.slice(1);
}

/* Exclusivity from Wikidata's origin statements, not from the dish's name. */
function localityFrom(facts,g){
  if(!facts)return{level:"",evidence:""};
  const all=facts.origins.concat(facts.named);
  const city=(g.name||"").toLowerCase(), dist=(g.district||"").toLowerCase(), st=(g.state||"").toLowerCase();
  for(const o of all){
    const lo=o.toLowerCase();
    if(city.length>3&&lo.indexOf(city)>-1)return{level:"city",evidence:o};
    if(dist.length>3&&lo.indexOf(dist)>-1)return{level:"district",evidence:o};
  }
  for(const o of all){
    const lo=o.toLowerCase();
    if(st.length>3&&lo.indexOf(st)>-1)return{level:"state",evidence:o};
  }
  return{level:all.length?"country":"",evidence:all[0]||""};
}

/* ── 4. shops, ranked by notability signals rather than taken at random ── */
const WANT={Sweet:["confectionery","pastry","chocolate","bakery"],Cake:["pastry","confectionery","bakery","cafe"],
  Bread:["bakery"],Soup:["restaurant"],Drink:["bar","pub","cafe"],Dumpling:["restaurant"],
  Noodles:["restaurant"],Rice:["restaurant"],Snack:["fast_food","bakery","restaurant"],
  Breakfast:["cafe","restaurant","fast_food"],Condiment:["deli","greengrocer"],Salad:["restaurant"],
  Dairy:["deli","cheese"],"Meat and fish":["restaurant","butcher"]};
function scoreShop(p,want,g){
  let s=0;
  if(want.indexOf(p.shop)>-1)s+=6;
  if(p.cuis&&want.some(w=>p.cuis.indexOf(w)>-1))s+=3;
  if(p.wd)s+=5;                    /* notable enough for its own Wikidata item */
  if(p.since)s+=4;                 /* records when it opened */
  if(p.site)s+=2;
  if(p.brand)s-=6;                 /* a chain, not a local institution */
  s+=Math.min(3,(p.tags||0)*0.15);
  const d=Math.hypot((p.lat-g.lat),(p.lon-g.lon)*0.67);
  s-=d*40;
  return s;
}

async function liveLookup(raw,step){
  /* stage 1 */
  step(0,"run","openstreetmap");
  const g=await geo(raw);
  if(!g)throw{soft:t("lnone")};
  const langs=wikiLangs(g);
  step(0,"run",g.display.split(",").slice(0,3).join(", "));

  let lang="en",cat=null;
  for(const probe of [g.district,g.state,g.country].filter(Boolean)){
    for(const lg of langs){ cat=await findCategory(lg,probe); if(cat){lang=lg;break;} }
    if(cat)break;
  }
  if(!cat)throw{soft:t("lnone")};
  const catLabel=cat.replace(/^[^:]*:/,"");
  step(0,"ok",g.display.split(",").slice(0,3).join(", ")+" · "+catLabel);

  /* stage 2 */
  step(1,"run",catLabel);
  const seen={},titles=[],subs=[];
  await categoryMembers(lang,cat,0,seen,titles,subs);
  for(const sc of subs.slice(0,5)){ try{await categoryMembers(lang,sc,1,seen,titles,subs)}catch(e){} }
  let names=titles.filter(x=>!/^(List of|Category:|Cuisine of|Outline of|History of)/i.test(x)&&!/ cuisine$/i.test(x));
  if(!names.length)throw{soft:t("lnone")};

  step(1,"run","wikidata · "+names.length);
  let facts={};
  try{ facts=await wikidataFacts(lang,names); }catch(e){}
  const known=Object.keys(facts).length;

  step(1,"run","openstreetmap · "+g.name);
  let places=[],placesErr="";
  try{
    const R=3000,parts=[];
    ["restaurant","cafe","fast_food","ice_cream","pub","bar"].forEach(a=>
      parts.push('nwr["amenity"="'+a+'"](around:'+R+','+g.lat+','+g.lon+');'));
    ["bakery","confectionery","pastry","chocolate","deli","butcher","cheese","greengrocer"].forEach(s=>
      parts.push('nwr["shop"="'+s+'"](around:'+R+','+g.lat+','+g.lon+');'));
    const oj=await opost('[out:json][timeout:60];('+parts.join("")+');out tags center 300;');
    places=(oj.elements||[]).map(e=>{const X=e.tags||{};return{
      n:X.name,shop:X.shop||X.amenity||"",cuis:(X.cuisine||"").toLowerCase(),
      wd:!!X.wikidata, since:X["start_date"]||X["opening_date"]||"", site:!!(X.website||X["contact:website"]),
      brand:!!(X.brand||X["brand:wikidata"]), tags:Object.keys(X).length,
      addr:[X["addr:street"],X["addr:housenumber"]].filter(Boolean).join(" ")||"",
      lat:e.lat||(e.center&&e.center.lat),lon:e.lon||(e.center&&e.center.lon)};})
      .filter(p=>p.n&&p.lat!=null);
    if(!places.length)placesErr="OpenStreetMap holds no tagged food places here";
  }catch(e){placesErr="could not reach OpenStreetMap";}
  step(1,"ok",names.length+" · wikidata "+known+" · "+(placesErr||places.length+" places"));

  /* stage 3 */
  step(2,"run","");
  const items=[];
  names.forEach(nm=>{
    const f=facts[nm];
    const cat2=typeFrom(f);
    if(!cat2)return;                         /* Wikidata silent -> not shown, not guessed */
    const loc=localityFrom(f,g);
    const want=WANT[cat2]||["restaurant"];
    const pool=places.map(p=>({p,s:scoreShop(p,want,g)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
    const pick=pool.length?pool[0].p:null;
    const tier=(loc.level==="city"||loc.level==="district")?"must":(loc.level==="state"?"worth":"");
    items.push({
      d:nm, vn:"", cat:cat2, live:1,
      tier:tier, only:(loc.level==="city"||loc.level==="district")?1:0,
      reg:loc.level==="state"?loc.evidence:"",
      veg:undefined,                          /* never guessed. spec 8 */
      src:(f&&f.origins.length?2:1),
      what:(f&&f.desc)||"",
      place:pick?pick.n:null,
      placeTxt:pick?null:t("noshop"),
      addr:pick?pick.addr:"", lat:pick?pick.lat:null, lon:pick?pick.lon:null,
      why:pick?(t("whyshop")+" "+pick.shop.replace(/_/g," ")
                +(pick.wd?", "+t("whynotable"):"")+(pick.since?", "+t("whysince")+" "+pick.since:"")):"",
      order:"",
      warn:loc.evidence?"":t("warnlive"),
      alts:pool.slice(1,4).map(x=>({n:x.p.n,d:[x.p.shop.replace(/_/g," "),x.p.addr].filter(Boolean).join(" · "),
                                    lat:x.p.lat,lon:x.p.lon}))
    });
  });
  /* distinguish "Wikidata unreachable" from "nothing qualified", so a network
     failure never masquerades as an empty city. */
  if(!items.length)throw{soft:(known===0?t("lfail"):t("lnone"))};
  items.sort((a,b)=>(b.only?1:0)-(a.only?1:0));

  return{
    name:g.name, live:1, lat:g.lat, lng:g.lon, ts:Date.now(),
    aka:[raw.toLowerCase(),g.name.toLowerCase()],
    items:items,
    sources:[
      {n:"Wikidata",k:"Structured facts, human-curated",
       b:"Wikidata states what each dish IS and where it came from, as properties rather than prose. "+known+" of "+names.length+" dishes had an entry.",
       note:"This is what replaced the keyword lists. A dish Wikidata says nothing about is left out rather than guessed at.",u:"https://www.wikidata.org/"},
      {n:"Wikipedia · "+catLabel,k:"Encyclopaedic, live",
       b:"The dish list is the members of this category and its subcategories, read in the '"+lang+"' edition.",
       note:"It knows which dishes exist. It knows nothing about where to eat them.",
       u:"https://"+lang+".wikipedia.org/wiki/"+enc(cat.replace(/ /g,"_"))},
      {n:"OpenStreetMap",k:"Open map data, live",
       b:placesErr?("The places step failed: "+placesErr+". Dish names are real; the shops are missing because of this."):(places.length+" food businesses within 3 km, ranked by notability signals rather than taken in the order they arrived."),
       note:"A shop with its own Wikidata entry, or a recorded opening date, scores above an unremarkable one. This is a signal, not a recommendation.",u:"https://www.openstreetmap.org/"}],
    gap:t("liveGap")
  };
}


/* ═══════════════════════════════════════════════════════════════════════
   WORKER CONTRACT

   GET  <WORKER_URL>?q=<city name>&lang=<2-letter code>
   200  → a pack object, same shape as the researched packs above:
          { name, live:1, aka:[], lat, lng, sources:[{n,k,b,note,u}],
            gap:"", items:[ { d, vn, cat, tier, only, local, reg, seas,
                              months, veg, what, order, why, warn, src,
                              place, placeTxt, addr, pid, lat, lon,
                              alts:[{n,d,pid,lat,lon}] } ] }
   Fields that drive this UI:
     tier   "must" | "worth" | "trip" | ""   which tab it lands in
     only   1 when exclusive to this city or district (spec 8)
     src    2 = two independent sources, 1 = single source, absent = unverified
     pid    Google Place ID when known  → exact business card
     lat/lon shop coordinates           → directions to the exact point
   Anything the Worker cannot verify it simply omits. This file never
   invents a fallback for a missing field.
   ═══════════════════════════════════════════════════════════════════════ */

let L="en"; const t=k=>(T[L]&&T[L][k])||T.en[k];

  S.done=JSON.parse(localStorage.getItem("fb2.done")||"{}")||{};
  const tb=localStorage.getItem("fb2.tab"); if(tb)S.tab=tb;
}catch(e){}
const save=(k,v)=>{try{localStorage.setItem("fb2."+k,v)}catch(e){}};

const inSeas=it=>!!it.months&&it.months.indexOf(MON)>-1;
const kk=it=>it.d+"|"+(it.place||it.placeTxt||"");

const vis=()=>(S.pack?S.pack.items:[]).filter(it=>!(S.veg&&it.veg!==1));

/* ── LINKS. Spec 5.3 and 7.3. Both bugs you reported are fixed here. ── */

/* A name in `query` is a text search, which is how one Siddhi Sweet Shop
   became seven. Coordinates pin one point. A Place ID pins one business.  */
function mapHref(o){
  if(o.pid) return "https://www.google.com/maps/search/?api=1&query="+enc(o.place||o.n||"")+"&query_place_id="+o.pid;
  if(o.lat!=null&&o.lon!=null) return "https://www.google.com/maps/dir/?api=1&destination="+o.lat+","+o.lon;
  return null;
}
/* Dish plus PLACE name. Never the shop name. A local-script name is used
   alone when it exists, because it finds what local people photographed. */
function photoHref(it,city){
  const localScript = it.vn && it.vn!==it.d && /[^\u0000-ɏ]/.test(it.vn);
  return "https://www.google.com/search?tbm=isch&q="+enc(localScript ? it.vn : (it.d+" "+city));
}

/* ── VERIFICATION, spec 8 ── */
function verTag(it){
  if(it.src>=2) return ["ver",t("ver")];
  if(it.src===1) return ["one",t("one")];
  return null;
}
function tagsFor(it){
  const g=[];
  if(it.only)g.push(["only",t("only")]);
  if(it.local)g.push(["local",t("local")]);
  const v=verTag(it); if(v)g.push(v);
  if(it.seas&&inSeas(it))g.push(["seas",t("inseas")]);
  else if(it.seas)g.push(["off",it.seas]);
  if(it.reg)g.push(["reg",it.reg]);
  return g.length?`<div class="tags">${g.map(([c,x])=>`<span class="tg ${c}">${esc(x)}</span>`).join("")}</div>`:"";
}

  document.getElementById("geo").addEventListener("click",()=>{
    const n=document.getElementById("hnote");
    if(!navigator.geolocation){n.textContent=t("lfail");return;}
    n.textContent="…";
    navigator.geolocation.getCurrentPosition(p=>{
      const near=Object.keys(PACKS).map(k=>[k,Math.hypot(p.coords.latitude-PACKS[k].lat,(p.coords.longitude-PACKS[k].lng)*0.67)])
        .sort((a,b)=>a[1]-b[1])[0];
      if(near[1]<1.1)start(near[0],PACKS[near[0]].name);
      else start(null,(p.coords.latitude.toFixed(3)+", "+p.coords.longitude.toFixed(3)));
    },()=>{n.textContent=t("lfail");},{enableHighAccuracy:true,timeout:9000,maximumAge:120000});});
  const typed=()=>{const raw=(document.getElementById("cin").value||"").trim();
    if(!raw)return;
    const v=raw.toLowerCase();
    const hit=Object.keys(PACKS).find(k=>PACKS[k].aka.some(a=>a.indexOf(v)===0||v.indexOf(a)===0));
    start(hit||null,hit?PACKS[hit].name:raw);};
  document.getElementById("cgo").addEventListener("click",typed);
  document.getElementById("cin").addEventListener("keydown",e=>{if(e.key==="Enter")typed();});
  app.querySelectorAll(".pickbtn").forEach(b=>b.addEventListener("click",()=>start(b.dataset.k,PACKS[b.dataset.k].name)));
}

/* ── THREE-STAGE LOADER ── */
function start(packKey,label){
  const names=[t("st1"),t("st2"),t("st3")];
  app.innerHTML=`<div class="load"><div class="lc">First Bite</div><h2>${esc(label)}</h2>
    <div class="steps">${names.map((n,i)=>
      `<div class="step" id="s${i}"><span class="stit">${SV.tick}</span>
        <span class="sbody"><span class="slbl">${esc(n)}</span><span class="ssub" id="u${i}"></span></span></div>`).join("")}</div>
    <div id="lout"></div></div>`;
  const step=(i,st,sub)=>{const e=document.getElementById("s"+i);if(!e)return;
    e.className="step "+(st==="ok"?"ok":st==="err"?"err":"run");
    const u=document.getElementById("u"+i); if(u&&sub!=null)u.textContent=sub;};
  const stop=(i,msg)=>{step(i,"err");
    document.getElementById("lout").innerHTML=
      `<p class="lerr">${esc(msg)}</p><button class="lback" id="lb">${esc(t("lback"))}</button>`;
    document.getElementById("lb").addEventListener("click",hello);};

  if(packKey&&PACKS[packKey]){
    const P=PACKS[packKey];
    step(0,"run","…");
    setTimeout(()=>{step(0,"ok",P.sources.map(s=>s.k).join(" · "));
      step(1,"run",P.items.length+" "+t("items"));
      setTimeout(()=>{step(1,"ok",P.items.length+" "+t("items"));
        step(2,"run","");
        setTimeout(()=>{step(2,"ok","");
          S.pack=P;S.key=packKey;REG=P.items;
          setTimeout(render,260);},300);},300);},320);
    return;
  }

  /* Live city: open data, no key, no account, no server.
     WORKER_URL, if ever set, simply overrides this path. */
  if(WORKER_URL){
    fetch(WORKER_URL+"?q="+enc(label)+"&lang="+L,{headers:{Accept:"application/json"}})
      .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(p=>{if(!p||!p.items||!p.items.length)throw{soft:t("lnone")};
        step(0,"ok",p.name||label);step(1,"ok",p.items.length+" "+t("items"));step(2,"ok","");
        S.pack=p;S.key=(p.name||label).toLowerCase();REG=p.items;setTimeout(render,300);})
      .catch(err=>stop(err&&err.soft?1:0,(err&&err.soft)||t("lfail")));
    return;
  }
  liveLookup(label,step).then(p=>{
    step(2,"ok","");
    S.pack=p;S.key=(p.name||label).toLowerCase();REG=p.items;
    setTimeout(render,300);
  }).catch(err=>stop(err&&err.soft?1:0,(err&&err.soft)||t("lfail")));
}

/* ── RENDER ── */
const TABS=[["must","sMust"],["worth","sWorth"],["trip","sTrip"],["all","sAll"]];
const listFor=(tab,items)=> tab==="all"
  ? items.slice().sort((a,b)=>a.d.localeCompare(b.d))
  : items.filter(i=>i.tier===tab);

function rowHTML(it){
  const i=REG.indexOf(it), on=!!S.done[kk(it)];
  const mh=mapHref(it);
  const where = it.place ? esc(it.place)+(it.addr?", "+esc(it.addr):"")
                         : `<span class="nosrc">${esc(it.placeTxt||t("noshop"))}</span>`;
  return `<div class="row ${on?"done":""}" data-i="${i}"><div class="rmain">
    <button class="tick" data-tk="${i}" aria-label="${esc(t("doneM"))}"><i>${SV.tick}</i></button>
    <div class="rtext"><div class="dish">${esc(it.d)}</div>
      ${it.vn&&it.vn!==it.d?`<div class="vn">${esc(it.vn)}</div>`:""}
      <div class="place">${where}</div>
      ${tagsFor(it)}</div>
    <div class="acts">
      ${mh?`<a class="act" href="${esc(mh)}" target="_blank" rel="noopener" aria-label="Map">${SV.pin}</a>`:""}
      <button class="act bi" data-i="${i}" aria-label="Info">${SV.info}</button>
      <button class="act bv" data-i="${i}" aria-label="Alt">${SV.chev}</button></div>
  </div><div class="alts" hidden></div></div>`;
}
function grouped(list){
  const order=[],by={};
  list.forEach(it=>{const c=it.cat||"Other";if(!by[c]){by[c]=[];order.push(c);}by[c].push(it);});
  return order.map(c=>`<div class="type">${esc(c)}</div>`+by[c].map(rowHTML).join("")).join("");
}

function render(){
  const P=S.pack; if(!P){hello();return;}
  const items=vis(); REG=P.items;
  const must=items.filter(i=>i.tier==="must");
  const dOf=a=>a.filter(i=>S.done[kk(i)]).length;
  const pM=must.length?Math.round(dOf(must)/must.length*100):0;
  const pA=items.length?Math.round(dOf(items)/items.length*100):0;
  if(!listFor(S.tab,items).length){
    const alt=TABS.map(x=>x[0]).find(k=>listFor(k,items).length);
    if(alt)S.tab=alt;}
  const list=listFor(S.tab,items);
  app.innerHTML=`
  <div class="mast"><h1>${esc(t("title"))} ${esc(P.name)}</h1><button class="chg" id="chg">${esc(t("chg"))}</button></div>
  <div class="prov"><span class="pvt ${P.live?"lv":"cur"}">${esc(P.live?t("livep"):t("curated"))}</span></div>
  <div class="mx">
    <div class="mxc only"><div class="mxh"><span class="em">📍</span>${esc(t("excl"))}</div><div class="mxn">${items.filter(i=>i.only).length}</div></div>
    <div class="mxc"><div class="mxh"><span class="em">😋</span>${esc(t("mustM"))}</div><div class="mxn">${must.length}</div></div>
    <div class="mxc"><div class="mxh">${esc(t("doneM"))}</div><div class="halves">
      <div class="half"><div class="hn">${pM}%</div><div class="hk">${esc(t("hMust"))}</div><div class="hbar"><i style="width:${pM}%"></i></div></div>
      <div class="half"><div class="hn">${pA}%</div><div class="hk">${esc(t("hAll"))}</div><div class="hbar"><i style="width:${pA}%"></i></div></div>
    </div></div>
  </div>
  <div class="tabs">${TABS.map(([k,lbl])=>
    `<button class="tb" data-tab="${k}" aria-pressed="${k===S.tab}">${esc(t(lbl))}<b>${listFor(k,items).length}</b></button>`).join("")}</div>
  <div class="tools"><button class="tool" id="vegF" aria-pressed="${S.veg}">${esc(t("veg"))}</button></div>
  <div class="sec">${list.length?(S.tab==="all"?list.map(rowHTML).join(""):grouped(list))
    :`<p class="empty">${esc(S.tab==="trip"?t("noTrip"):"—")}</p>`}</div>
  <div class="srcs"><h2>${esc(t("srcH"))}</h2>
    ${P.sources.map(s=>`<div class="sitem"><div class="sn">${esc(s.n)}</div><div class="sk">${esc(s.k)}</div>
      <div class="sb">${esc(s.b)}</div>${s.note?`<div class="sb">${esc(s.note)}</div>`:""}
      ${s.u?`<a class="sl" href="${esc(s.u)}" target="_blank" rel="noopener">${esc(t("opensrc"))}</a>`:""}</div>`).join("")}
    <p class="cav">${esc(P.gap||"")}</p><p class="cav">${esc(t("cav"))}</p></div>`;
  document.getElementById("chg").addEventListener("click",()=>{S.pack=null;hello();window.scrollTo(0,0);});
  document.getElementById("vegF").addEventListener("click",()=>{S.veg=!S.veg;render();});
  app.querySelectorAll(".tb").forEach(b=>b.addEventListener("click",()=>{
    S.tab=b.dataset.tab;save("tab",S.tab);render();window.scrollTo(0,0);}));
}

app.addEventListener("click",e=>{
  const bi=e.target.closest(".bi"), bv=e.target.closest(".bv"), tk=e.target.closest(".tick");
  if(tk){const it=REG[+tk.dataset.tk],k=kk(it);
    if(S.done[k])delete S.done[k];else S.done[k]=1;
    save("done",JSON.stringify(S.done));render();return;}
  if(bi){sheet(REG[+bi.dataset.i]);return;}
  if(bv){const row=bv.closest(".row"),box=row.querySelector(".alts"),it=REG[+bv.dataset.i];
    if(!box.hasChildNodes()){
      box.innerHTML=(it.alts&&it.alts.length)?it.alts.map(a=>{
        const mh=mapHref(a);
        return `<div class="alt"><div class="at"><div class="an">${esc(a.n)}</div><div class="ad">${esc(a.d||"")}</div></div>
          <div class="acts">${mh?`<a class="act" href="${esc(mh)}" target="_blank" rel="noopener" aria-label="Map">${SV.pin}</a>`:""}
          <a class="act" href="${esc(photoHref({d:it.d,vn:it.vn},S.pack.name))}" target="_blank" rel="noopener" aria-label="Photos">${SV.cam}</a></div></div>`;}).join("")
        :`<div class="none">${esc(t("alts"))}</div>`;}
    const sh=box.hidden;box.hidden=!sh;bv.classList.toggle("on",sh);}
});

function sheet(it){
  const f=(l,v,c)=>v?`<div class="fld ${c||""}"><span class="eb">${l}</span><p>${esc(v)}</p></div>`:"";
  const mh=mapHref(it), ph=photoHref(it,S.pack.name);
  const d=document.createElement("div");d.className="scrim";
  d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">
    <div class="shd"><div><h3>${esc(it.d)}</h3>${it.vn&&it.vn!==it.d?`<div class="vn">${esc(it.vn)}</div>`:""}</div>
      <button class="sx" aria-label="Close">×</button></div>
    ${tagsFor(it)}
    <div class="btns">
      ${mh?`<a class="btn" href="${esc(mh)}" target="_blank" rel="noopener">${SV.nav} ${esc(t("directions"))}</a>`:""}
      <a class="btn" href="${esc(ph)}" target="_blank" rel="noopener">${SV.cam} ${esc(t("photo"))}</a>
    </div>
    ${f(esc(t("what")),it.what)}${f(esc(t("order")),it.order)}
    ${f(esc(t("where")),it.place?it.place+(it.addr?", "+it.addr:""):it.placeTxt)}
    ${f(esc(t("why")),it.why)}
    ${it.warn?`<div class="fld"><span class="eb">${esc(t("warn"))}</span><p class="red">${esc(it.warn)}</p></div>`:""}
    ${f(esc(t("howver")),it.src>=2?t("ver2"):(it.src===1?t("ver1"):t("ver0")))}
  </div>`;
  d.addEventListener("click",e=>{if(e.target===d||e.target.classList.contains("sx"))d.remove();});
  document.body.appendChild(d);
}
hello();
})();
</script>
