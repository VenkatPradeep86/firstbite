 ta:{greet:"வணக்கம். நீங்கள் எங்கே இருக்கிறீர்கள்?",say:"உங்கள் இருப்பிடத்தைப் பகிரவும், அல்லது எந்த நகரத்தின் பெயரையும் தட்டச்சு செய்யவும். ஆராய்ச்சி செய்யப்பட்ட தொகுப்பு இல்லாத நகரங்கள் நேரலையில் தேடப்படும்.",loc:"என் இருப்பிடத்தைப் பயன்படுத்து",tph:"எந்த நகரத்தின் பெயரும்",go:"செல்",or:"ஆராய்ச்சி செய்யப்பட்ட தொகுப்புகள்",lang:"மொழி",
  lnote:"உணவு மற்றும் கடைகளின் பெயர்கள் உள்ளூர் மொழியிலேயே இருக்கும், நீங்கள் அவற்றைச் சொல்ல வேண்டும்.",items:"சாப்பிட வேண்டியவை",
  excl:"இங்கே மட்டுமே",mustM:"கட்டாயம்",doneM:"முடிந்தது",hMust:"கட்டாயம்",hAll:"மொத்தம்",
  sMust:"கட்டாயம் சுவைக்க வேண்டியவை",sWorth:"சுவைக்கத் தகுந்தவை",sTrip:"ஒரு நாள் பயணம்",sAll:"முழுமை",
  veg:"சைவம் மட்டும்",open:"இன்று திறந்திருக்கும்",chg:"மாற்று",title:"First Bite",

  curated:"ஆராய்ச்சி செய்யப்பட்டது",livep:"நேரலைத் தேடல்",refresh:"புதுப்பி",updated:"புதுப்பிக்கப்பட்டது",justnow:"இப்போதே",minago:"நிமிடம் முன்",hrago:"மணி முன்",dayago:"நாள் முன்",
  srcH:"இந்த ஆதாரங்கள் பற்றி",cav:"எதுவும் நட்சத்திர மதிப்பீட்டின் அடிப்படையில் வரிசைப்படுத்தப்படவில்லை. நேரங்கள் OpenStreetMap-இலிருந்தும், தேர்வுக்குப் பிறகு செய்த தேடலிலிருந்தும் வருகின்றன, அவை மாறும். முன்பே அழைக்கவும்.",
  st1:"உள்ளூர் உணவு ஆதாரங்களைச் சேகரிக்கிறோம்",st2:"உணவுகளையும் கடைகளையும் பெறுகிறோம்",st3:"முடிவைத் தயாரிக்கிறோம்",
  noTrip:"இந்த நகரத்திற்கு இன்னும் பயண உணவுகள் இல்லை. பயணம் செய்ய எது தகுதியானது என்று நேரலைத் தேடல் தீர்மானிக்க முடியாது.",
  lfail:"இந்தப் பக்கத்திலிருந்து நேரலைத் தேடல் இணையத்தை அடைய முடியவில்லை. கோப்பு உங்கள் சொந்த டொமைனில் இருக்கும்போது இது வேலை செய்யும், அங்கு உலாவி OpenStreetMap மற்றும் Wikipedia-வை அழைக்க முடியும்.",
  lnone:"அந்தப் பெயருக்கு சாப்பிடக்கூடியது எதுவும் வரவில்லை. எழுத்துப்பிழையைச் சரிபார்க்கவும், அல்லது அருகிலுள்ள பெரிய நகரத்தை முயற்சிக்கவும்.",lback:"திரும்பு"},

   {d:"Wiener Schnitzel vom Kalb",vn:"Kalbsschnitzel",cat:"Main",tier:"must",veg:0,place:"Meissl & Schadn",pid:"ChIJvygGgJ0HbUcRUOU9epLpWyc",addr:"Schubertring 10-12, 1010 Wien",hours:"Daily 12:00 to 23:30, no closing day",
    what:"The real one is veal, not pork. Hammered thin, breaded with Kaisersemmel crumbs, fried so the coating lifts away from the meat.",order:"You choose the fat: lard, clarified butter or oil. Lard is the traditional answer.",
    why:"The only place named by both sources in this pack. Takes its name from a restaurant destroyed in 1945.",src:2,
    alts:[{n:"Zum Schwarzen Kameel",d:"Bognergasse 5, 1010. An inn for over 400 years."},{n:"Gmoakeller",d:"Am Heumarkt 25, 1030. Falstaff readers' most popular Beisl."}]},
   {d:"Tafelspitz",vn:"Tafelspitz",cat:"Main",tier:"must",veg:0,place:"Plachutta Wollzeile",pid:"ChIJ8aGpZXUHbUcR7RhDMQpSArs",addr:"Wollzeile 38, 1010 Wien",hours:"Daily 11:30 to 23:30",
    what:"Beef simmered in broth, carried to the table in a copper pot with marrow bone, root vegetables, chive sauce and apple horseradish. The broth is its own course.",
    order:"Do not order soup separately and do not add sides. The pot is already the meal.",why:"Named as the Tafelspitz address, in the copper pots the dish is known by.",
    warn:"Reviewers report hard upselling. Decline extras and check the bill.",src:1,
    alts:[{n:"Meissl & Schadn",d:"Schubertring 10-12, 1010. Also named for Tafelspitz.",pid:"ChIJvygGgJ0HbUcRUOU9epLpWyc"},{n:"Zur Herknerin",d:"Wiedner Hauptstraße 36, 1040. Thursday and Friday evenings only.",pid:"ChIJYz1kd4EHbUcR1pRBSwM86aE"}]},
   {d:"Schweinsschnitzel",vn:"Schweinsschnitzel",cat:"Main",tier:"must",veg:0,place:"Café Anzengruber",pid:"ChIJk8AdcYQHbUcRCED7KB6Lv7k",addr:"Schleifmühlgasse 19, 1040 Wien",closed:[0,1],hours:"Tue to Sat 16:00 to 01:00",
    what:"The pork version, cut wide and thin so it overhangs the plate. Cheaper, less reverent, and what most Viennese actually eat.",order:"Take the lingonberry jam. Go early, it fills with locals.",
    why:"Named by both sources. Falstaff calls it legendary. A Beisl by the Naschmarkt, not a dining room.",
    warn:"Cash only. Opens 16:00. Closed Monday and Sunday. Expect to be pressed to order a drink.",src:2,
    alts:[{n:"Automat-Welt",d:"Volkertplatz, 1020. Praised by trade experts for pork schnitzel."},{n:"Figlmüller",d:"The famous one. Falstaff notes it is known mainly to tourists."}]},
   {d:"Apfelstrudel",vn:"Apfelstrudel",cat:"Dessert",tier:"must",veg:1,place:"Demel",pid:"ChIJiY3_UpgHbUcRWCIbHu4EWXY",addr:"Kohlmarkt 14, 1010 Wien",hours:"Daily 10:00 to 19:00",
    what:"Apple, raisin and cinnamon in pastry stretched until you could read through it.",order:"Warm, mit Vanillesauce.",why:"Named beside its Sachertorte and Buchteln.",src:1,
    alts:[{n:"Wiener Stadtbräu",d:"Graben 29a, 1010. Open 365 days a year."}]},
   {d:"Sachertorte",vn:"Sachertorte",cat:"Cake",tier:"must",veg:1,place:"Demel",pid:"ChIJiY3_UpgHbUcRWCIbHu4EWXY",addr:"Kohlmarkt 14, 1010 Wien",hours:"Daily 10:00 to 19:00",
    what:"Dense chocolate cake with apricot jam under a hard glaze. Demel and Hotel Sacher fought a long court battle over whose is original; the difference is where the jam layer sits.",
    order:"Mit Schlag, unsweetened whipped cream, is not optional locally.",why:"Eating it here rather than at Sacher is the contested half of the story.",src:1,
    alts:[{n:"Hotel Sacher",d:"Philharmoniker Straße 4, 1010. The other claimant. Not named by this pack's sources."}]},
   {d:"Sturm",vn:"Sturm",cat:"Drink",tier:"worth",veg:1,seas:"Sept to late Oct",months:[8,9],placeTxt:"Any Heuriger in Grinzing, Nussdorf or Neustift",

   {d:"Maroni",vn:"Maroni",cat:"Snack",tier:"worth",veg:1,seas:"Oct to Dec",months:[9,10,11],placeTxt:"Roasting stands on Graben, Kärntner Straße and most U-Bahn exits",

   {d:"Martinigansl",vn:"Martinigansl",cat:"Main",tier:"worth",veg:0,seas:"Late Oct to mid Nov",months:[9,10],place:"Café Restaurant Markt58",addr:"Marktgasse 58, 1090 Wien",

 steyr:{name:"Steyr",aka:["steyr","stayr","steier"],lat:48.0405,lng:14.4212,
  sources:[
   {n:"Schwarz auf Weiss, Steyr Mehlspeisenrundgang",k:"German travel journalism",
    b:"A long-form pastry walk through Steyr that names each shop, its owner and the building it sits in, rather than listing addresses.",
    note:"It is the only source found that documents the Steyrer Torte, the Froschel and the Schnalle at all. Everything city-exclusive in this pack comes from it.",
    u:"https://www.schwarzaufweiss.de/oesterreich/steyr-kulinarisch.htm"},
   {n:"Oberösterreich Tourismus",k:"Official regional tourism board",
    b:"The province's own kitchen pages, where each regional recipe is credited to a specific named restaurant rather than written anonymously.",
    note:"That crediting is why Knapp am Eck appears here: the board picked one kitchen in the whole province as its Grammelknödel source.",
    u:"https://www.oberoesterreich.at/kulinarik/rezepte/spezialitaeten-aus-oesterreich-typische-rezepte-aus-oberoesterreich.html"},
   {n:"Local word of mouth",k:"Unverified, included on request",
    b:"One entry here comes from local recommendation rather than published food writing, and is marked Locals' pick.",
    note:"It is not an Austrian speciality and does not belong in the canon, but people in Steyr rate it, which is its own kind of useful.",
    u:""}],
  gap:"Two published sources, which is what a city of 38,000 yields. MeinBezirk's local Geheimtipps column was identified as a third but not read. The sweet side is far better covered than the savoury side, and that imbalance sits in the sources, not in the ranking.",
  items:[
   {d:"Steyrer Torte",vn:"Steyrer Torte",cat:"Cake",tier:"must",veg:1,only:1,place:"Café Konditorei Schmidt",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg",addr:"Stadtplatz 1, 4400 Steyr",closed:[0,1],hours:"Tue to Fri 09:00 to 18:00, Sat 09:00 to 17:30",
    what:"Chocolate torte with nuts and redcurrant jam on shortcrust, at 70 percent cocoa. Sold in a box printed with the confluence of the Steyr and the Enns.",
    order:"A slice in the café, or the whole torte boxed to carry.",
    why:"Invented by the current owner about fifteen years ago. The Schmidt family has held the house 85 years and is in its third generation. The name is unprotected, so any confectioner may make one, but this is where it started.",
    warn:"Closed Monday and Sunday.",src:1,alts:[]},
   {d:"Froschel",vn:"Froschel / Froscherl",cat:"Cake",tier:"must",veg:1,only:1,place:"Café Konditorei Schmidt",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg",addr:"Stadtplatz 1, 4400 Steyr",closed:[0,1],hours:"Tue to Fri 09:00 to 18:00, Sat 09:00 to 17:30",
    what:"A violently green sand-cake with cherry buttercream under sugar fondant. The colour is the point and it is not subtle.",
    order:"Ask by name. It is a local word, not a menu category.",why:"The current owner's grandfather brought the idea back from Wiesbaden and France. Found nowhere outside Steyr.",
    warn:"Closed Monday and Sunday.",src:1,alts:[]},
   {d:"Steyrer Schnalle",vn:"Steyrer Schnalle",cat:"Sweet",tier:"must",veg:1,only:1,place:"Bäckerei Fröhlich, Lebzelterhaus",pid:"ChIJfaez4_jFc0cRzgrXFFyFzgI",addr:"Kirchengasse 20, Steyrdorf",closed:[0],hours:"Mon to Fri 06:30 to 18:00, Sat 07:00 to 12:00",
    what:"A chocolate taler of marzipan, dark chocolate and Dirndl jam, made from cornelian cherries. Named for the toll once charged at the Schnallentor.",
    order:"Ask at the counter by name.",
    why:"Made by master baker Rainer Fröhlich in the Lebzelterhaus, a building going back to the 16th century where wax candles were drawn and Lebkuchen baked. A city exclusive named after a city gate.",
    warn:"The map pin may land on the Stadtplatz 28 branch. The Lebzelterhaus is Kirchengasse 20. Check before walking.",src:1,alts:[]},
   {d:"Essbare Dachschindeln",vn:"essbare Dachschindeln",cat:"Snack",tier:"must",veg:1,only:1,place:"Bäckerei Fröhlich, Lebzelterhaus",pid:"ChIJfaez4_jFc0cRzgrXFFyFzgI",addr:"Kirchengasse 20, Steyrdorf",closed:[0],hours:"Mon to Fri 06:30 to 18:00, Sat 07:00 to 12:00",

/* ===================== opening_hours -> today ===================== */
function dayMatches(spec,ti){
  return spec.split(",").some(p=>{
    p=p.trim();
    const r=p.match(/^([A-Z][a-z])\s*-\s*([A-Z][a-z])$/);
    if(r){const a=OSMD.indexOf(r[1]),b=OSMD.indexOf(r[2]);
      if(a<0||b<0)return false;
      return a<=b ? (ti>=a&&ti<=b) : (ti>=a||ti<=b);}
    return OSMD.indexOf(p)===ti;});
}
function ohToday(s){
  if(!s)return null;
  s=String(s).trim();
  if(/^24\s*\/\s*7$/.test(s))return{open:true,txt:"24/7"};
  const ti=DAY; let found=null;
  s.split(";").forEach(r=>{
    r=r.trim(); if(!r)return;
    const m=r.match(/^((?:[A-Z][a-z](?:\s*-\s*[A-Z][a-z])?)(?:\s*,\s*[A-Z][a-z](?:\s*-\s*[A-Z][a-z])?)*)\s+(.+)$/);
    let times=r, spec=null;
    if(m){spec=m[1];times=m[2];}
    if(spec&&!dayMatches(spec,ti))return;
    if(/^(off|closed)$/i.test(times.trim())){found={open:false,txt:"closed"};return;}
    const tm=times.match(/\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/g);
    if(tm)found={open:true,txt:tm.join(", ")};
  });
  return found;
}

async function jget(url,ms){
  const c=new AbortController(), tm=setTimeout(()=>c.abort(),ms||10000);
  try{const r=await fetch(url,{signal:c.signal,headers:{Accept:"application/json"}});
    if(!r.ok)throw new Error("HTTP "+r.status);
    return await r.json();}
  finally{clearTimeout(tm);}
}
async function opost(body){
  let last=null;
  for(const ep of OVP){
    const c=new AbortController(), tm=setTimeout(()=>c.abort(),45000);
    try{const r=await fetch(ep,{method:"POST",signal:c.signal,body:"data="+enc(body),
        headers:{"Content-Type":"application/x-www-form-urlencoded"}});
      if(r.status===429||r.status===504){last=new Error("busy");continue;}
      if(!r.ok)throw new Error("HTTP "+r.status);
      return await r.json();}
    catch(e){last=e}
    finally{clearTimeout(tm)}
  }
  throw last||new Error("overpass unreachable");
}
/* must name a concrete edible thing... */
const FOODRE=/\b(dish|cake|torte|gateau|pastry|pastries|bread|flatbread|roll|bun|loaf|soup|broth|stew|goulash|dumpling|sausage|pudding|biscuit|cookie|beverage|drink|beer|wine|cider|cheese|sweet|sweets|dessert|snack|noodle|pasta|pancake|roast|strudel|schnitzel|halwa|curry|rice|biryani|porridge|fritter|pie|tart|confection|candy|chocolate|jam|preserve|parotta|paratha|roti|dosa|idli|sundal|chutney|pickle|salad)\b/i;
/* ...and must NOT be a cuisine, a custom or a place. This is what Bush tucker,
   Chifa and Christian dietary laws all trip over. */
const NOTDISH=/(\bcuisine\b|dietary law|dietary practice|culinary tradition|refers to (the )?food|is a (term|region|country|city|province|state|ethnic|language)|food industry|agricultur|restaurant chain|is the practice|eating habits|table manners|is a style of cooking)/i;
function catOf(s){
  s=(s||"").toLowerCase();
  if(/\b(halwa|barfi|laddu|laddoo|kheer|payasam|jaggery|sweetmeat|candy|toffee|fudge|marzipan)\b/.test(s))return "Sweet";
  if(/\b(cake|torte|gateau|tart|strudel|pie|cheesecake)\b/.test(s))return "Cake";
  if(/\b(pastry|biscuit|cookie|doughnut|donut|bun|croissant|scone)\b/.test(s))return "Pastry";
  if(/\b(bread|roti|parotta|paratha|naan|flatbread|loaf|chapati|dosa|dosai)\b/.test(s))return "Bread";
  if(/\b(soup|broth|consomm|rasam|shorba)\b/.test(s))return "Soup";
  if(/\b(beer|wine|coffee|tea|juice|beverage|liquor|cocktail|spirit|cider|lassi|drink|soda|lemonade|schnapps|spritz)\b/.test(s))return "Drink";
  if(/\b(ice cream|sorbet|gelato|pudding|custard|dessert)\b/.test(s))return "Dessert";
  if(/\b(dumpling|knödel|knodel|momo|pierogi|gnocchi)\b/.test(s))return "Dumpling";
  if(/\b(noodle|pasta|spätzle|spaetzle|vermicelli)\b/.test(s))return "Noodles";
  if(/\b(rice|biryani|pulao|pilaf|risotto)\b/.test(s))return "Rice";
  if(/\b(snack|fritter|chaat|crisp|street food|savoury snack)\b/.test(s))return "Snack";
  if(/\b(sausage|ham|bacon|charcuterie|cured)\b/.test(s))return "Charcuterie";
  return "Main";
}
const SHOPFOR={Sweet:["confectionery","chocolate","pastry","sweets"],Cake:["pastry","confectionery","bakery"],
 Pastry:["bakery","pastry","confectionery"],Bread:["bakery"],Dessert:["ice_cream","pastry","cafe"],
 Drink:["bar","pub","cafe","beverages"],Snack:["fast_food","bakery","deli"],Charcuterie:["butcher","deli"]};

async function liveLookup(q,step){
  /* ---- stage 1: sources ---- */
  step(0,"run","nominatim.openstreetmap.org");
  const g=await geo(q);
  if(!g)throw {soft:"nocity"};
  step(0,"run",g.display.split(",").slice(0,3).join(", "));
  const topic=g.state||g.country||g.name;
  let cats=[];
  for(const probe of [g.state,g.country,topic].filter(Boolean)){
    try{const cs=await jget(WP+"?action=query&list=search&srnamespace=14&srlimit=5&format=json&origin=*&srsearch="+enc(probe+" cuisine"),10000);
      ((cs.query||{}).search||[]).forEach(x=>{if(/cuisine|dishes|desserts|food/i.test(x.title)&&cats.indexOf(x.title)<0)cats.push(x.title)});
    }catch(e){}
    if(cats.length)break;
  }
  if(!cats.length)throw {soft:"nodish"};
  const label=cats[0].replace(/^Category:/,"");
  step(0,"ok",g.display.split(",").slice(0,3).join(", ")+" · "+label);

  /* ---- stage 2: dishes + places ---- */
  step(1,"run",label);
  const seen={},subs=[];
  let titles=[];
  async function members(cat,depth){
    const cm=await jget(WP+"?action=query&list=categorymembers&cmtype=page%7Csubcat&cmlimit=300&format=json&origin=*&cmtitle="+enc(cat),12000);
    ((cm.query||{}).categorymembers||[]).forEach(m=>{
      if(m.ns===14){if(depth<1&&subs.length<7&&/cuisine|dish|dessert|bread|cake|sweet|pastr|soup|drink|beverage|snack/i.test(m.title)&&subs.indexOf(m.title)<0)subs.push(m.title);}
      else if(!seen[m.title]){seen[m.title]=1;titles.push(m.title);}});
  }
  await members(cats[0],0);
  for(const sc of subs.slice(0,6)){step(1,"run",sc.replace(/^Category:/,""));try{await members(sc,1)}catch(e){}}
  titles=titles.filter(x=>!/^(List of|Category:|Cuisine of|Outline of|History of|.* cuisine$)/i.test(x));
  if(!titles.length)throw {soft:"nodish"};
  const cLC=g.name.toLowerCase(), sLC=(g.state||"").toLowerCase();
  const hot=titles.filter(x=>{const l=x.toLowerCase();
    return (cLC.length>3&&l.indexOf(cLC)>-1)||(sLC.length>3&&l.indexOf(sLC)>-1);});
  const cold=titles.filter(x=>hot.indexOf(x)<0);
  const stepN=Math.max(1,Math.ceil(cold.length/80));
  titles=hot.concat(cold.filter((_,i)=>i%stepN===0)).slice(0,88);
  if(!titles.length)throw {soft:"nodish"};
  const ext={};
  for(let i=0;i<titles.length;i+=20){
    const chunk=titles.slice(i,i+20);
    step(1,"run","wikipedia · "+Math.min(i+20,titles.length)+"/"+titles.length);
    try{
      const ex=await jget(WP+"?action=query&prop=extracts&exintro=1&explaintext=1&exsentences=2&format=json&origin=*&titles="+enc(chunk.join("|")),12000);
      const pp=(ex.query||{}).pages||{};
      Object.keys(pp).forEach(k=>{if(pp[k].extract)ext[pp[k].title]=pp[k].extract.replace(/\s+/g," ").trim()});
    }catch(e){}
  }
  const dishes=Object.keys(ext).filter(k=>FOODRE.test(ext[k])&&!NOTDISH.test(ext[k])&&!NOTDISH.test(k)).slice(0,40);
  if(!dishes.length)throw {soft:"nodish"};

  step(1,"run","openstreetmap · places near "+g.name);
  let places=[],placesErr="";
  try{
    const R=3000,parts=[];
    ["restaurant","cafe","fast_food","ice_cream","pub","bar"].forEach(a=>
      parts.push('nwr["amenity"="'+a+'"](around:'+R+','+g.lat+','+g.lon+');'));
    ["bakery","confectionery","pastry","chocolate","deli","butcher"].forEach(s=>
      parts.push('nwr["shop"="'+s+'"](around:'+R+','+g.lat+','+g.lon+');'));
    const oq='[out:json][timeout:60];('+parts.join("")+');out tags center 250;';
    const oj=await opost(oq);
    places=(oj.elements||[]).map(e=>{const T2=e.tags||{};return{
      n:T2.name,shop:T2.shop||T2.amenity||"",cuis:(T2.cuisine||"").toLowerCase(),
      oh:T2.opening_hours||"",
      addr:[T2["addr:street"],T2["addr:housenumber"]].filter(Boolean).join(" ")||"",
      lat:e.lat||(e.center&&e.center.lat),lon:e.lon||(e.center&&e.center.lon)};})
      .filter(p=>p.n);
    if(!places.length)placesErr="reached OpenStreetMap but it holds no tagged food places here";
  }catch(e){placesErr="could not reach OpenStreetMap ("+((e&&e.message)||"blocked")+")";}
  step(1,placesErr?"run":"ok",dishes.length+" dishes · "+(placesErr||places.length+" places"));

  /* ---- stage 3: assemble ---- */
  step(2,"run","matching and checking today");
  const cityLC=g.name.toLowerCase(), stateLC=(g.state||"").toLowerCase();
  const items=dishes.map(title=>{
    const txt=ext[title];
    const cat=catOf(title+" "+txt);
    const named=cityLC.length>3&&(title.toLowerCase().indexOf(cityLC)>-1||txt.toLowerCase().indexOf(cityLC)>-1);
    const regional=!named&&stateLC.length>3&&title.toLowerCase().indexOf(stateLC)>-1;
    const want=SHOPFOR[cat]||[];
    const pool=places.filter(p=>want.indexOf(p.shop)>-1||want.some(w=>p.cuis.indexOf(w)>-1));
    const pick=pool[0]||null;
    const oh=pick?ohToday(pick.oh):null;
    return{
      d:title,vn:"",cat:cat,live:1,
      tier:named?"must":(regional?"must":"worth"),
      only:named?1:0,reg:regional?(g.state||""):"",
      veg:/\bvegetarian|vegan\b/i.test(txt)?1:(/\b(meat|pork|beef|chicken|mutton|fish|lamb|sausage|prawn)\b/i.test(txt)?0:1),
      what:txt,
      place:pick?pick.n:null,
      placeTxt:pick?null:"No shop matched. Ask for it by name locally.",
      addr:pick?(pick.addr||""):"",
      hours:oh?oh.txt:(pick&&pick.oh?pick.oh:""),
      closedToday:oh?!oh.open:null,
      why:pick?("Matched by shop type ("+pick.shop.replace(/_/g," ")+") from OpenStreetMap, not by reputation. A researched pack would name the best one instead."):
                "The live lookup found the dish but no shop of the right type nearby.",
      order:named?"The dish carries this city's name, which is the strongest signal a live lookup can read.":"",
      warn:named?"":"Live result, not reviewed by any food writer.",
      alts:pool.slice(1,4).map(p=>({n:p.n,d:[p.shop.replace(/_/g," "),p.addr,(ohToday(p.oh)||{}).txt].filter(Boolean).join(" · ")}))
    };
  });
  // put named-after-the-city dishes first inside must
  items.sort((a,b)=>(b.only?1:0)-(a.only?1:0));
  const extra=places.filter(p=>p.oh).slice(0,10);
  return{
    name:g.name,live:1,lat:g.lat,lng:g.lon,ts:Date.now(),
    aka:[q.toLowerCase(),g.name.toLowerCase()],
    items:items,
    sources:[
      {n:"OpenStreetMap, via Nominatim and Overpass",k:"Live, open data",
       b:"Nominatim turned the name you typed into coordinates. "+(placesErr?("The places step FAILED: "+placesErr+". Dish names below are real; the shops are missing because of this, not because the city has none."):("Overpass then returned "+places.length+" food businesses within 3 km, with whatever opening hours local mappers have recorded.")),
       note:"Opening hours here are as live as OpenStreetMap is, which varies by city. "+extra.length+" of these places had hours recorded. Nominatim's usage policy forbids autocomplete, so lookup only runs when you press Go.",
       u:"https://operations.osmfoundation.org/policies/nominatim/"},
      {n:"Wikipedia, "+label,k:"Live, encyclopaedic",
       b:"Dishes come from the members of this category and its subcategories, then each one's opening lines must name a concrete edible thing. Articles about a cuisine, a custom or a place are rejected.",
       note:"It knows what the dishes are and nothing about where to eat them. That gap is the whole reason researched packs exist.",
       u:"https://en.wikipedia.org/wiki/"+enc(cats[0].replace(/ /g,"_"))}],
    gap:"This pack was assembled live and nobody has reviewed it. It can tell you a dish exists in this region and find a shop of the right type nearby, but it cannot tell you which shop is good, which dish is exclusive to this city rather than the wider region, or what is worth a day trip. Dishes carrying the city's own name are promoted to Must try because that is the one exclusivity signal readable without a human."
  };
}
async function geo(q){
  const j=await jget(NOM+"?format=jsonv2&addressdetails=1&limit=1&accept-language=en&q="+enc(q),11000);
  if(!j||!j.length)return null;
  const a=j[0], ad=a.address||{};
  return{name:a.name||q,lat:+a.lat,lon:+a.lon,display:a.display_name||q,
    country:ad.country||"",state:ad.state||ad.region||ad.county||""};
}

/* refresh a researched pack's opening hours from OpenStreetMap, without blocking the page */
async function refreshHours(pack,after){
  if(!pack.lat)return;
  try{
    const oq='[out:json][timeout:20];('
      +'nwr["amenity"~"^(restaurant|cafe|fast_food|pub|bar|ice_cream)$"](around:3000,'+pack.lat+','+pack.lng+');'
      +'nwr["shop"~"^(bakery|confectionery|pastry|chocolate)$"](around:3000,'+pack.lat+','+pack.lng+');'
      +');out tags 200;';
    const oj=await opost(oq);
    const by={};
    (oj.elements||[]).forEach(e=>{const T2=e.tags||{};
      if(T2.name&&T2.opening_hours)by[norm(T2.name)]=T2.opening_hours;});
    let n=0;
    pack.items.forEach(it=>{
      if(!it.place)return;
      const k=norm(it.place), hit=by[k]||Object.keys(by).find(x=>x.indexOf(k)>-1||k.indexOf(x)>-1);
      const oh=hit?ohToday(by[k]||by[hit]):null;
      if(oh){it.hours=oh.txt;it._liveH=1;it.closedToday=!oh.open;n++;}
    });
    if(n&&after)after(n);
  }catch(e){}
}
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,18);

const S={city:null,pack:null,tab:"must",veg:false,openOnly:false,done:{},note:""};
try{

}catch(e){}
const save=(k,v)=>{try{localStorage.setItem("fb."+k,v)}catch(e){}};
const CACHE_V=3;
const cacheGet=s=>{try{const j=JSON.parse(localStorage.getItem("fb.c."+s)||"null");
  return j&&j.v===CACHE_V&&Date.now()-j.ts<86400000?j:null;}catch(e){return null}};
const cacheSet=(s,p)=>{try{p.v=CACHE_V;localStorage.setItem("fb.c."+s,JSON.stringify(p))}catch(e){}};
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

const shut=it=>it.closedToday===true||(Array.isArray(it.closed)&&it.closed.indexOf(DAY)>-1);
const inSeas=it=>!!it.months&&it.months.indexOf(MON)>-1;
const kk=it=>it.d+"|"+(it.place||it.placeTxt||"");
const app=document.getElementById("app");
let REG=[];
const vis=()=>(S.pack?S.pack.items:[]).filter(it=>{
  if(S.veg&&!it.veg)return false;
  if(S.openOnly&&shut(it))return false;
  return true;});
function ago(ts){
  const m=Math.round((Date.now()-ts)/60000);
  if(m<2)return t("justnow");
  if(m<60)return m+" "+t("minago");
  if(m<1440)return Math.round(m/60)+" "+t("hrago");
  return Math.round(m/1440)+" "+t("dayago");
}

    <p class="hnote" id="hnote">${esc(S.note)}</p></div>`;
  document.getElementById("lsel").addEventListener("change",e=>{L=e.target.value;save("lang",L);hello();});
  document.getElementById("geo").addEventListener("click",()=>{
    const n=document.getElementById("hnote");
    if(!navigator.geolocation){n.textContent="This browser gives no location. Type a city instead.";return;}
    n.textContent="…";
    navigator.geolocation.getCurrentPosition(p=>{
      const near=Object.keys(PACKS).map(k=>[k,Math.hypot(p.coords.latitude-PACKS[k].lat,(p.coords.longitude-PACKS[k].lng)*0.67)])
        .sort((a,b)=>a[1]-b[1])[0];
      if(near[1]<1.1)start(near[0],PACKS[near[0]].name);
      else start(null,p.coords.latitude.toFixed(4)+", "+p.coords.longitude.toFixed(4));
    },()=>{n.textContent="Location refused or blocked here. Type a city instead.";},
    {enableHighAccuracy:true,timeout:9000,maximumAge:120000});});
  const typed=()=>{const raw=(document.getElementById("cin").value||"").trim();
    if(!raw)return;
    const v=raw.toLowerCase();
    const hit=Object.keys(PACKS).find(k=>PACKS[k].aka.some(a=>a.indexOf(v)===0||v.indexOf(a)===0));
    start(hit||null,raw);};
  document.getElementById("cgo").addEventListener("click",typed);
  document.getElementById("cin").addEventListener("keydown",e=>{if(e.key==="Enter")typed();});
  app.querySelectorAll(".pickbtn").forEach(b=>b.addEventListener("click",()=>start(b.dataset.k,PACKS[b.dataset.k].name)));
}

/* ===================== 3-stage loader ===================== */
function start(packKey,label,force){
  const names=[t("st1"),t("st2"),t("st3")];
  app.innerHTML=`<div class="load"><div class="lc">First Bite</div><h2>${esc(label)}</h2>
    <div class="steps">${names.map((n,i)=>
      `<div class="step" id="s${i}"><span class="stit">${SV.tick}</span>
        <span class="sbody"><span class="slbl">${esc(n)}</span><span class="ssub" id="u${i}"></span></span></div>`).join("")}</div>
    <div id="lout"></div></div>`;
  const step=(i,st,sub)=>{const e=document.getElementById("s"+i);if(!e)return;
    e.className="step "+(st==="ok"?"ok":st==="err"?"err":"run");
    const u=document.getElementById("u"+i); if(u&&sub!=null)u.textContent=sub;};
  const fail=(i,msg)=>{step(i,"err");
    const o=document.getElementById("lout");
    o.innerHTML=`<p class="lerr">${esc(msg)}</p><button class="lback" id="lb">${esc(t("lback"))}</button>`;
    document.getElementById("lb").addEventListener("click",()=>{S.note="";hello();});};

  if(packKey&&PACKS[packKey]){
    // researched pack: stages are real but quick, then hours refresh runs live in the background
    step(0,"run",PACKS[packKey].sources.length+" reviewed sources");
    setTimeout(()=>{step(0,"ok",PACKS[packKey].sources.map(s=>s.k).join(" · "));
      step(1,"run",PACKS[packKey].items.length+" dishes");
      setTimeout(()=>{S.pack=PACKS[packKey];S.city=packKey;REG=S.pack.items;
        step(1,"ok",S.pack.items.length+" dishes · "+new Set(S.pack.items.map(i=>i.place||i.placeTxt)).size+" places");
        step(2,"run","checking today");
        setTimeout(()=>{step(2,"ok",DAYN[DAY]);
          setTimeout(()=>{render();
            refreshHours(S.pack,n=>{S.pack._hoursLive=n;S.pack._hoursAt=Date.now();if(S.city===packKey)render();});
          },260);},300);},300);},320);
    return;
  }
  // live city
  const sl=slug(label);
  const cached=!force&&cacheGet(sl);
  if(cached){
    step(0,"ok","cache · "+ago(cached.ts));step(1,"ok",cached.items.length+" dishes");
    setTimeout(()=>{step(2,"ok",DAYN[DAY]);S.pack=cached;S.city=sl;REG=cached.items;setTimeout(render,240);},260);
    return;
  }
  liveLookup(label,step).then(p=>{
    step(2,"ok",p.items.length+" dishes · "+DAYN[DAY]);
    cacheSet(sl,p); S.pack=p; S.city=sl; REG=p.items;
    setTimeout(render,300);
  }).catch(err=>{
    const soft=err&&err.soft;
    if(soft==="nocity"||soft==="nodish")fail(0,t("lnone"));
    else fail(0,t("lfail"));
  });
}

/* ===================== city view ===================== */
function tagsFor(it){
  const g=[];
  if(it.only)g.push(["only",t("only")]);
  if(it.local)g.push(["local",t("local")]);
  if(it.live)g.push(["lv",t("livet")]);
  if(it.seas&&inSeas(it))g.push(["seas",t("inseas")]);
  else if(it.seas)g.push(["off",it.seas]);
  if(it.reg)g.push(["reg",it.reg]);
  if(shut(it))g.push(["shut",t("closed")]);
  return g.length?`<div class="tags">${g.map(([c,x])=>`<span class="tg ${c}">${esc(x)}</span>`).join("")}</div>`:"";
}
function rowHTML(it){
  const i=REG.indexOf(it), on=!!S.done[kk(it)];
  const q=it.place?it.place+" "+(it.addr||""):(it.placeTxt||"");
  return `<div class="row ${on?"done":""}" data-i="${i}"><div class="rmain">
    <button class="tick" data-tk="${i}" aria-label="Mark eaten"><i>${SV.tick}</i></button>
    <div class="rtext"><div class="dish">${esc(it.d)}</div>
      ${it.vn?`<div class="vn">${esc(it.vn)}</div>`:""}
      <div class="place">${it.place?esc(it.place)+(it.addr?", "+esc(it.addr):""):esc(it.placeTxt||"")}</div>
      ${tagsFor(it)}</div>
    <div class="acts">
      ${it.place?`<a class="act" href="${esc(G(q,it.pid))}" target="_blank" rel="noopener" aria-label="Map">${SV.pin}</a>`:""}
      <button class="act bi" data-i="${i}" aria-label="Info">${SV.info}</button>
      <button class="act bv" data-i="${i}" aria-label="Alternatives">${SV.chev}</button></div>
  </div><div class="alts" hidden></div></div>`;
}
function grouped(list){
  const order=[],by={};
  list.forEach(it=>{const c=it.cat||"Other";if(!by[c]){by[c]=[];order.push(c);}by[c].push(it);});
  return order.map(c=>`<div class="type">${esc(c)}</div>`+by[c].map(rowHTML).join("")).join("");
}
const TABS=[["must","sMust"],["worth","sWorth"],["trip","sTrip"],["all","sAll"]];
function listFor(tab,items){
  if(tab==="all")return items.slice().sort((a,b)=>a.d.localeCompare(b.d));
  return items.filter(i=>i.tier===tab);
}
function render(){
  const P=S.pack; if(!P){hello();return;}
  const items=vis(); REG=P.items;
  const must=items.filter(i=>i.tier==="must");
  const dOf=a=>a.filter(i=>S.done[kk(i)]).length;
  const pM=must.length?Math.round(dOf(must)/must.length*100):0;
  const pA=items.length?Math.round(dOf(items)/items.length*100):0;
  if(!listFor(S.tab,items).length){
    const alt=TABS.map(x=>x[0]).find(k=>listFor(k,items).length);
    if(alt)S.tab=alt;}
  const list=listFor(S.tab,items);
  const live=!!P.live;
  app.innerHTML=`
  <div class="mast"><h1>${esc(t("title"))} ${esc(P.name)}</h1><button class="chg" id="chg">${esc(t("chg"))}</button></div>
  <div class="prov">
    <span class="pvt ${live?"lv":"cur"}">${esc(live?t("livep"):t("curated"))}</span>
    ${live?`<span class="age">${esc(t("updated"))} ${esc(ago(P.ts))}</span><button class="rf" id="rfr">${esc(t("refresh"))}</button>`:""}
    ${P._hoursLive?`<span class="age">${P._hoursLive} × OSM hours · ${esc(ago(P._hoursAt))}</span>`:""}
  </div>
  <div class="mx">
    <div class="mxc only"><div class="mxh"><span class="em">📍</span>${esc(t("excl"))}</div><div class="mxn">${items.filter(i=>i.only).length}</div></div>
    <div class="mxc"><div class="mxh"><span class="em">😋</span>${esc(t("mustM"))}</div><div class="mxn">${must.length}</div></div>
    <div class="mxc"><div class="mxh">${esc(t("doneM"))}</div><div class="halves">
      <div class="half"><div class="hn">${pM}%</div><div class="hk">${esc(t("hMust"))}</div><div class="hbar"><i style="width:${pM}%"></i></div></div>
      <div class="half"><div class="hn">${pA}%</div><div class="hk">${esc(t("hAll"))}</div><div class="hbar"><i style="width:${pA}%"></i></div></div>
    </div></div>
  </div>
  <div class="tabs">${TABS.map(([k,lbl])=>
    `<button class="tb" data-tab="${k}" aria-pressed="${k===S.tab}">${esc(t(lbl))}<b>${listFor(k,items).length}</b></button>`).join("")}</div>
  <div class="tools"><button class="tool" id="vegF" aria-pressed="${S.veg}">${esc(t("veg"))}</button>
    <button class="tool" id="openF" aria-pressed="${S.openOnly}">${esc(t("open"))}</button></div>
  <div class="sec">${list.length?(S.tab==="all"?list.map(rowHTML).join(""):grouped(list))
    :`<p class="empty">${esc(S.tab==="trip"?t("noTrip"):"—")}</p>`}</div>
  <div class="srcs"><h2>${esc(t("srcH"))}</h2>
    ${P.sources.map(s=>`<div class="sitem"><div class="sn">${esc(s.n)}</div><div class="sk">${esc(s.k)}</div>
      <div class="sb">${esc(s.b)}</div><div class="sb">${esc(s.note)}</div>
      ${s.u?`<a class="sl" href="${esc(s.u)}" target="_blank" rel="noopener">Open source</a>`:""}</div>`).join("")}
    <p class="cav">${esc(P.gap)}</p><p class="cav">${esc(t("cav"))}</p>
    <p class="cav">Place and hours data © OpenStreetMap contributors, ODbL. Dish text from Wikipedia, CC BY-SA.</p></div>`;
  document.getElementById("chg").addEventListener("click",()=>{S.pack=null;S.city=null;S.note="";hello();window.scrollTo(0,0);});
  document.getElementById("vegF").addEventListener("click",()=>{S.veg=!S.veg;render();});
  document.getElementById("openF").addEventListener("click",()=>{S.openOnly=!S.openOnly;render();});
  const r=document.getElementById("rfr");
  if(r)r.addEventListener("click",()=>start(null,P.name,true));
  app.querySelectorAll(".tb").forEach(b=>b.addEventListener("click",()=>{
    S.tab=b.dataset.tab;save("tab",S.tab);render();window.scrollTo(0,0);}));
}

app.addEventListener("click",e=>{
  const bi=e.target.closest(".bi"), bv=e.target.closest(".bv"), tk=e.target.closest(".tick");
  if(tk){const it=REG[+tk.dataset.tk],k=kk(it);
    if(S.done[k])delete S.done[k];else S.done[k]=1;
    save("done",JSON.stringify(S.done));render();return;}
  if(bi){sheet(REG[+bi.dataset.i]);return;}
  if(bv){const row=bv.closest(".row"),box=row.querySelector(".alts"),it=REG[+bv.dataset.i];
    if(!box.hasChildNodes()){
      box.innerHTML=(it.alts&&it.alts.length)?it.alts.map(a=>{
        const q=a.n+" "+(a.d||"");
        return `<div class="alt"><div class="at"><div class="an">${esc(a.n)}</div><div class="ad">${esc(a.d||"")}</div></div>
          <div class="acts"><a class="act" href="${esc(G(q,a.pid))}" target="_blank" rel="noopener" aria-label="Map">${SV.pin}</a>
          <a class="act" href="${esc(IMG(it.d+" "+a.n))}" target="_blank" rel="noopener" aria-label="Photos">${SV.cam}</a></div></div>`;}).join("")
        :`<div class="none">${esc(t("alts"))}</div>`;}
    const sh=box.hidden;box.hidden=!sh;bv.classList.toggle("on",sh);}
});

function sheet(it){
  const q=it.place?it.place+" "+(it.addr||""):(it.placeTxt||"");
  const f=(l,v,c)=>v?`<div class="fld ${c||""}"><span class="eb">${l}</span><p>${esc(v)}</p></div>`:"";
  const d=document.createElement("div");d.className="scrim";
  d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">
    <div class="shd"><div><h3>${esc(it.d)}</h3>${it.vn?`<div class="vn">${esc(it.vn)}</div>`:""}</div>
      <button class="sx" aria-label="Close">×</button></div>
    ${tagsFor(it)}
    <a class="photos" href="${esc(IMG(it.d+" "+(it.place||"")+" "+(it.vn||"")))}" target="_blank" rel="noopener">${SV.cam} ${esc(t("photo"))}</a>
    ${f(esc(t("what")),it.what)}${f(esc(t("order")),it.order)}
    ${f(esc(t("where")),it.place?it.place+(it.addr?", "+it.addr:""):it.placeTxt)}
    ${f(esc(t("why")),it.why)}
    ${f(esc(t("hours"))+(it._liveH?" · OSM":""),it.hours,"mono")}
    ${shut(it)?`<div class="fld"><span class="eb">${esc(t("closed"))}</span><p class="red">${esc(DAYN[DAY])}.</p></div>`:""}
    ${it.warn?`<div class="fld"><span class="eb">${esc(t("warn"))}</span><p class="red">${esc(it.warn)}</p></div>`:""}
    ${it.place?`<div class="fld"><span class="eb">${esc(t("where"))}</span><p><a href="${esc(G(q,it.pid))}" target="_blank" rel="noopener">Google Maps</a></p></div>`:""}
  </div>`;
  d.addEventListener("click",e=>{if(e.target===d||e.target.classList.contains("sx"))d.remove();});
  document.body.appendChild(d);
}
hello();
})();
</script>
