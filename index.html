    why:"The only place named by both sources in this pack. Takes its name from a restaurant destroyed in 1945.",src:2,
    alts:[{n:"Zum Schwarzen Kameel",d:"Bognergasse 5, 1010. An inn for over 400 years."},{n:"Gmoakeller",d:"Am Heumarkt 25, 1030. Falstaff readers' most popular Beisl."}]},
   {d:"Tafelspitz",vn:"Tafelspitz",cat:"Main",tier:"must",veg:0,place:"Plachutta Wollzeile",pid:"ChIJ8aGpZXUHbUcR7RhDMQpSArs",addr:"Wollzeile 38, 1010 Wien",
    what:"Beef simmered in broth, carried to the table in a copper pot with marrow bone, root vegetables, chive sauce and apple horseradish. The broth is its own course.",
    order:"Do not order soup separately and do not add sides. The pot is already the meal.",why:"Named as the Tafelspitz address, in the copper pots the dish is known by.",
    warn:"Reviewers report hard upselling. Decline extras and check the bill.",src:1,
    alts:[{n:"Meissl & Schadn",d:"Schubertring 10-12, 1010. Also named for Tafelspitz.",pid:"ChIJvygGgJ0HbUcRUOU9epLpWyc"},{n:"Zur Herknerin",d:"Wiedner Hauptstraße 36, 1040. Thursday and Friday evenings only.",pid:"ChIJYz1kd4EHbUcR1pRBSwM86aE"}]},
   {d:"Schweinsschnitzel",vn:"Schweinsschnitzel",cat:"Main",tier:"must",veg:0,place:"Café Anzengruber",pid:"ChIJk8AdcYQHbUcRCED7KB6Lv7k",addr:"Schleifmühlgasse 19, 1040 Wien",
    what:"The pork version, cut wide and thin so it overhangs the plate. Cheaper, less reverent, and what most Viennese actually eat.",order:"Take the lingonberry jam. Go early, it fills with locals.",
    why:"Named by both sources. Falstaff calls it legendary. A Beisl by the Naschmarkt, not a dining room.",
    warn:"Cash only. Opens 16:00. Closed Monday and Sunday. Expect to be pressed to order a drink.",src:2,
    alts:[{n:"Automat-Welt",d:"Volkertplatz, 1020. Praised by trade experts for pork schnitzel."},{n:"Figlmüller",d:"The famous one. Falstaff notes it is known mainly to tourists."}]},
   {d:"Apfelstrudel",vn:"Apfelstrudel",cat:"Dessert",tier:"must",veg:1,place:"Demel",pid:"ChIJiY3_UpgHbUcRWCIbHu4EWXY",addr:"Kohlmarkt 14, 1010 Wien",
    what:"Apple, raisin and cinnamon in pastry stretched until you could read through it.",order:"Warm, mit Vanillesauce.",why:"Named beside its Sachertorte and Buchteln.",src:1,
    alts:[{n:"Wiener Stadtbräu",d:"Graben 29a, 1010. Open 365 days a year."}]},
   {d:"Sachertorte",vn:"Sachertorte",cat:"Cake",tier:"must",veg:1,place:"Demel",pid:"ChIJiY3_UpgHbUcRWCIbHu4EWXY",addr:"Kohlmarkt 14, 1010 Wien",
    what:"Dense chocolate cake with apricot jam under a hard glaze. Demel and Hotel Sacher fought a long court battle over whose is original; the difference is where the jam layer sits.",
    order:"Mit Schlag, unsweetened whipped cream, is not optional locally.",why:"Eating it here rather than at Sacher is the contested half of the story.",src:1,
    alts:[{n:"Hotel Sacher",d:"Philharmoniker Straße 4, 1010. The other claimant. Not named by this pack's sources."}]},
   {d:"Sturm",vn:"Sturm",cat:"Drink",tier:"worth",veg:1,seas:"Sept to late Oct",months:[8,9],placeTxt:"Any Heuriger in Grinzing, Nussdorf or Neustift",
    what:"Partly fermented young wine, cloudy and still working. Sweet, deceptively strong, and by law only sellable during its short season.",order:"Ask for weisser or roter Sturm, by the Viertel.",
    why:"Seasonal by statute rather than fashion. Gone by November.",warn:"No source here named a specific Heuriger. Unverified.",alts:[]},
   {d:"Maroni",vn:"Maroni",cat:"Snack",tier:"worth",veg:1,seas:"Oct to Dec",months:[9,10,11],placeTxt:"Roasting stands on Graben, Kärntner Straße and most U-Bahn exits",
    what:"Chestnuts roasted in a drum and sold by the decagram in a paper cone. The stands appear with the first cold week and vanish after Christmas.",
    order:"10 dag is a normal portion. Sweet Kipferl come from the same cart.",why:"The one food that tells you the season turned.",warn:"Stands are mobile. A pin would be a street, not a shop.",alts:[]},
   {d:"Martinigansl",vn:"Martinigansl",cat:"Main",tier:"worth",veg:0,seas:"Late Oct to mid Nov",months:[9,10],place:"Café Restaurant Markt58",addr:"Marktgasse 58, 1090 Wien",
    what:"Roast goose with red cabbage and dumplings, eaten around St Martin's day on 11 November. Kitchens run a Gansl menu for about three weeks, then stop.",
    order:"Book. Gansl menus fill.",why:"Its seasonal Gansl menu is named specifically.",src:1,alts:[]},
   {d:"Spinatknödel",vn:"Spinatknödel",cat:"Dumpling",tier:"worth",veg:1,place:"Zur Herknerin",pid:"ChIJYz1kd4EHbUcR1pRBSwM86aE",addr:"Wiedner Hauptstraße 36, 1040 Wien",
    what:"Spinach dumplings in brown butter. The kitchen is built on dumplings and the menu is handwritten, changing weekly.",order:"Dumplings as starter, main and dessert is a normal order here.",
    why:"Run by Stefanie Herkner, who grew up in her parents' Gasthaus.",warn:"Thursday and Friday evenings only. Cash only. Book ahead.",src:1,alts:[]},
   {d:"Backhendl",vn:"Backhendl",cat:"Main",tier:"worth",veg:0,place:"Gasthaus Woracziczky",pid:"ChIJ-1KKJyaobUcRwE_3K3vf7so",addr:"Spengergasse 52, 1050 Wien",
    what:"Breaded fried chicken, schnitzel's poultry sibling, traditionally with cold potato salad.",order:"Menu is handwritten and changes. Ask what the soup is.",
    why:"Michelin-recommended and still a plain Beisl rather than a dining room.",warn:"Cash only. Closed Saturday and Sunday.",src:1,
    alts:[{n:"Zum Renner",d:"Nussdorfer Platz 4, 1190. Over a century old."}]},
   {d:"Schweinsbraten",vn:"Schweinsbraten",cat:"Main",tier:"worth",veg:0,place:"Zum Renner",addr:"Nussdorfer Platz 4, 1190 Wien",
    what:"Roast pork with crackling, dumpling and caraway. The Sunday plate of Austrian home cooking.",order:"Comes with Semmelknödel and kraut.",why:"Has run for more than a century.",src:1,
    alts:[{n:"Medl Bräu",d:"Linzer Straße 275, 1140. Also named, and brews its own beer."}]},
   {d:"Rindsgulasch",vn:"Rindsgulasch",cat:"Main",tier:"worth",veg:0,place:"Medl Bräu",addr:"Linzer Straße 275, 1140 Wien",
    what:"Beef stewed with far more onion than meat, until the onion dissolves into sauce. Viennese, not Hungarian: no vegetables, no sour cream.",
    order:"With a Semmel to wipe the plate. As Fiakergulasch it arrives with a fried egg and a sausage on top.",why:"Named for its Gulasch, Rauchspeckbrot and fried Emmentaler. Brews its own beer.",src:1,
    alts:[{n:"Café Restaurant Markt58",d:"Marktgasse 58, 1090. Hungarian-leaning Gulaschsuppe."}]},
   {d:"Eiernockerl",vn:"Eiernockerl",cat:"Main",tier:"worth",veg:1,place:"Restaurant Fromme Helene",addr:"Josefstädter Straße 15, 1080 Wien",
    what:"Small flour dumplings tossed through scrambled egg. Cheap, filling, and one of the few Viennese classics that is genuinely vegetarian.",order:"Comes with green salad. Ask for it.",
    why:"Named here, and the value is called good.",src:1,alts:[]},
   {d:"Krautfleckerl",vn:"Krautfleckerl",cat:"Main",tier:"worth",veg:1,place:"Restaurant Fromme Helene",addr:"Josefstädter Straße 15, 1080 Wien",
    what:"Square pasta flecks with caramelised cabbage and a lot of black pepper. Peasant food that stayed on menus.",order:"Usually a main, sometimes a side.",why:"Named by the city magazine.",src:1,
    alts:[{n:"Wiener Stadtbräu",d:"Graben 29a, 1010. Also named for Krautfleckerl."}]},
   {d:"Buchteln",vn:"Buchteln",cat:"Dessert",tier:"worth",veg:1,place:"Demel",pid:"ChIJiY3_UpgHbUcRWCIbHu4EWXY",addr:"Kohlmarkt 14, 1010 Wien",
    what:"Sweet yeast buns baked touching so they tear apart, filled with plum jam, served warm with vanilla sauce.",order:"Warm or not at all. A Bohemian import that became Viennese.",why:"Named in the Konditorei survey.",src:1,
    alts:[{n:"Konditorei Bienchen",d:"Sonnenallee 122, 1220. Also named, plus vegan Krapfen."}]},
   {d:"Esterházyschnitte",vn:"Esterházy-Schnitte",cat:"Cake",tier:"worth",veg:1,place:"Konditorei Oberlaa",addr:"Kurbadstraße 12, 1100 Wien",
    what:"Almond meringue and buttercream under white fondant, combed into the stripe pattern that identifies it on sight.",order:"One slice. Very sweet.",why:"Named for this specifically.",src:1,alts:[]},
   {d:"Punschkrapfen",vn:"Punschkrapfen",cat:"Pastry",tier:"worth",veg:1,place:"Konditorei Oberdöbling",addr:"Döblinger Hauptstraße 63-65, 1190 Wien",
    what:"A pink cube of cake offcuts soaked in rum and jam, glazed shocking pink. Deliberately made from leftovers, and loved anyway.",order:"One. Stronger than it looks.",why:"Named in the Konditorei survey.",src:1,
    alts:[{n:"Konditorei Hüftgold",d:"Meidlinger Marktstand 35-36, 1120. Also named. Open daily."}]},
   {d:"Topfentorte",vn:"Topfentorte",cat:"Cake",tier:"worth",veg:1,place:"Crème de la Crème",addr:"Lange Gasse 76, 1080 Wien",
    what:"Baked quark cheesecake. Topfen is drier and more sour than cream cheese, so it eats lighter than it sounds.",order:"The baked one is the one named.",why:"Named in the Konditorei survey.",src:1,
    alts:[{n:"Crème de la Crème – La petite",d:"4th district, by U4 Kettenbrückengasse. Same house."}]},
   {d:"Frittatensuppe",vn:"Frittatensuppe",cat:"Soup",tier:"worth",veg:0,place:"Gasthaus Woracziczky",pid:"ChIJ-1KKJyaobUcRwE_3K3vf7so",addr:"Spengergasse 52, 1050 Wien",
    what:"Clear beef broth with pancakes sliced into ribbons. The standard Austrian starter.",order:"Comes before almost anything else.",why:"Named at two houses.",warn:"Cash only. Closed Sat and Sun.",src:1,
    alts:[{n:"Restaurant Fromme Helene",d:"Josefstädter Straße 15, 1080. Also named."}]},
   {d:"Palatschinken",vn:"Palatschinken",cat:"Dessert",tier:"worth",veg:1,place:"Gasthaus Woracziczky",pid:"ChIJ-1KKJyaobUcRwE_3K3vf7so",addr:"Spengergasse 52, 1050 Wien",
    what:"Thin pancakes rolled round apricot jam or quark. Thicker than a crêpe, thinner than an American pancake.",order:"Mit Marillenmarmelade is the default.",why:"Named by the city magazine.",src:1,alts:[]},
   {d:"Zwiebelrostbraten",vn:"Zwiebelrostbraten",cat:"Main",tier:"worth",veg:0,place:"Plachutta Wollzeile",pid:"ChIJ8aGpZXUHbUcR7RhDMQpSArs",addr:"Wollzeile 38, 1010 Wien",
    what:"Sirloin under a heap of crisp fried onions, with roast potatoes.",order:"Say how you want it cooked. Well done is often the default.",why:"Named beside the Tafelspitz.",src:1,
    alts:[{n:"Café Restaurant Markt58",d:"Marktgasse 58, 1090. Also named."}]},
   {d:"Grammelknöderl",vn:"Grammelknöderl",cat:"Dumpling",tier:"worth",veg:0,place:"DAST Restaurant",addr:"Schulgasse 85, 1180 Wien",
    what:"Dumplings filled with pork crackling, served here tapas-sized rather than plate-filling.",order:"The kitchen does Austrian dishes as small plates. Order several.",why:"Run by Stephanie Pache and Daniel Fischer.",src:1,alts:[]},
   {d:"Mohnnudeln",vn:"Mohnnudeln",cat:"Sweet",tier:"worth",veg:1,place:"DAST Restaurant",addr:"Schulgasse 85, 1180 Wien",
    what:"Finger-shaped potato noodles rolled in ground poppy seed and sugar. Sweet, eaten as a main.",order:"Topfenknödel sit beside them.",why:"Named by the city magazine.",src:1,alts:[]},
   {d:"Kärntner Kasnudeln",vn:"Kärntner Kasnudeln",cat:"Dumpling",tier:"worth",veg:1,place:"Figls",addr:"Grinzinger Straße 55, 1190 Wien",reg:"Carinthian",
    what:"Large pasta pockets of quark, potato and mint, crimped by hand along one edge. From Carinthia, far south of here.",order:"Figls also does a vegan Wiener Schnitzel.",why:"Named by the city magazine.",src:1,alts:[]},
   {d:"Salzburger Nockerl",vn:"Salzburger Nockerl",cat:"Dessert",tier:"worth",veg:1,place:"Meissl & Schadn",pid:"ChIJvygGgJ0HbUcRUOU9epLpWyc",addr:"Schubertring 10-12, 1010 Wien",reg:"Salzburg",
    what:"Three baked peaks of sweet soufflé dusted with sugar, shaped after the mountains outside Salzburg. Collapses within minutes.",order:"Takes 20 minutes. Order it with the main.",why:"Named by the city magazine.",src:1,alts:[]},
   {d:"Linzer Torte",vn:"Linzer Torte",cat:"Cake",tier:"worth",veg:1,place:"Konditorei Oberlaa",addr:"Kurbadstraße 12, 1100 Wien",reg:"Linz",
    what:"Redcurrant jam under a lattice of nut and spice shortcrust. Claimed as the oldest cake with a surviving written recipe.",order:"Keeps for days, so it travels.",why:"Named in the Konditorei survey.",src:1,alts:[]},
   {d:"Sarma",vn:"Sarma",cat:"Main",tier:"",veg:0,local:1,place:"Zur Herknerin",pid:"ChIJYz1kd4EHbUcR1pRBSwM86aE",addr:"Wiedner Hauptstraße 36, 1040 Wien",reg:"Balkan",
    what:"Stuffed sour cabbage rolls. Not Austrian, but Vienna's large Balkan population has made it a city dish, and it turns up on Austrian menus without comment.",
    order:"Ask whether it is on this week. The menu changes.",why:"Shown in the Herknerin entry, which is an Austrian kitchen serving it as a matter of course.",warn:"Thursday and Friday evenings only. Cash only.",src:1,alts:[]},
   {d:"Käsespätzle",vn:"Käsespätzle",cat:"Main",tier:"",veg:1,place:"Café Restaurant Markt58",addr:"Marktgasse 58, 1090 Wien",reg:"Vorarlberg and Tyrol",what:"Egg noodles layered with mountain cheese and fried onion.",why:"Named by the city magazine.",src:1,alts:[]},
   {d:"Gebackener Emmentaler",vn:"gebackener Emmentaler",cat:"Snack",tier:"",veg:1,place:"Medl Bräu",addr:"Linzer Straße 275, 1140 Wien",what:"Deep-fried cheese with tartare sauce. The default vegetarian option in any Austrian Gasthaus.",why:"Named by the city magazine.",src:1,alts:[]},
   {d:"Rauchspeckbrot",vn:"Rauchspeckbrot",cat:"Snack",tier:"",veg:0,place:"Medl Bräu",addr:"Linzer Straße 275, 1140 Wien",what:"Smoked bacon on dark bread, eaten with the house beer.",why:"Named by the city magazine.",src:1,alts:[]},
   {d:"Leberknödelsuppe",vn:"Leberknödelsuppe",cat:"Soup",tier:"",veg:0,place:"Restaurant Fromme Helene",addr:"Josefstädter Straße 15, 1080 Wien",what:"Beef broth with a liver dumpling in it.",why:"Named by the city magazine.",src:1,alts:[]},
   {d:"Kalbsrahmgulasch",vn:"Kalbsrahmgulasch",cat:"Main",tier:"",veg:0,place:"Plachutta Wollzeile",pid:"ChIJ8aGpZXUHbUcR7RhDMQpSArs",addr:"Wollzeile 38, 1010 Wien",what:"Veal in paprika cream, milder than the beef version.",why:"Named by the city magazine.",src:1,alts:[]},
   {d:"Butterschnitzel",vn:"Butterschnitzel",cat:"Main",tier:"",veg:0,place:"Plachutta Wollzeile",pid:"ChIJ8aGpZXUHbUcR7RhDMQpSArs",addr:"Wollzeile 38, 1010 Wien",what:"Minced veal patty, soft and unbreaded. Nursery food for adults.",why:"Named by the city magazine.",src:1,alts:[]},
   {d:"Paprikahendl",vn:"Paprikahendl",cat:"Main",tier:"",veg:0,place:"Meissl & Schadn",pid:"ChIJvygGgJ0HbUcRUOU9epLpWyc",addr:"Schubertring 10-12, 1010 Wien",what:"Chicken in paprika cream, Hungarian by origin and long since absorbed.",why:"Named by the city magazine.",src:1,alts:[]},
   {d:"Wiener Schnitzel, vegan",vn:"veganes Wiener Schnitzel",cat:"Main",tier:"",veg:1,place:"Figls",addr:"Grinzinger Straße 55, 1190 Wien",what:"The breaded treatment applied to something other than veal.",why:"Named by the city magazine.",src:1,alts:[]},
   {d:"Hausstrudel",vn:"Hausstrudel",cat:"Dessert",tier:"",veg:1,place:"Zur Herknerin",pid:"ChIJYz1kd4EHbUcR1pRBSwM86aE",addr:"Wiedner Hauptstraße 36, 1040 Wien",what:"The house strudel. The filling moves with the weekly menu.",why:"Named beside the Spinatknödel.",warn:"Thursday and Friday evenings only.",src:1,alts:[]},
   {d:"Marmorgugelhupf",vn:"Marmorgugelhupf",cat:"Cake",tier:"",veg:1,place:"Konditorei Oberlaa",addr:"Kurbadstraße 12, 1100 Wien",what:"Marbled ring cake, the standard Austrian afternoon cake.",why:"Named in the Konditorei survey.",src:1,alts:[]},
   {d:"Apfel-Streusel-Kuchen",vn:"Apfel-Streusel-Kuchen",cat:"Cake",tier:"",veg:1,place:"Konditorei Oberlaa",addr:"Kurbadstraße 12, 1100 Wien",what:"Apple cake under crumble.",why:"Named in the Konditorei survey.",src:1,alts:[]},
   {d:"Trüffeltorte",vn:"Trüffeltorte",cat:"Cake",tier:"",veg:1,place:"Demel",pid:"ChIJiY3_UpgHbUcRWCIbHu4EWXY",addr:"Kohlmarkt 14, 1010 Wien",what:"Chocolate truffle torte, with a passionfruit one beside it.",why:"Named in the Konditorei survey.",src:1,alts:[]},
   {d:"Maronischnitte",vn:"Maronischnitte",cat:"Cake",tier:"",veg:1,seas:"Autumn",months:[8,9,10],place:"Ella's Twins",addr:"Vorgartenmarkt Stand 13, 1020 Wien",what:"Chestnut slice from a market stall run by twin brothers and their mother, Ella.",why:"Named in the Konditorei survey.",src:1,
    alts:[{n:"Konditorei Bienchen",d:"Sonnenallee 122, 1220. Also named."}]},
   {d:"Bienenstich",vn:"Bienenstich",cat:"Cake",tier:"",veg:1,place:"Konditorei Hüftgold",addr:"Meidlinger Marktstand 35-36, 1120 Wien",what:"Yeast cake with caramelised almonds and custard. Run by Mark Ruiz Hellín, open daily.",why:"Named in the Konditorei survey.",src:1,alts:[]},
   {d:"Mandelhörnchen",vn:"Mandelhörnchen",cat:"Pastry",tier:"",veg:1,place:"Konditorei Hüftgold",addr:"Meidlinger Marktstand 35-36, 1120 Wien",what:"Almond crescent dipped in chocolate at both ends.",why:"Named in the Konditorei survey.",src:1,alts:[]},

 steyr:{name:"Steyr",aka:["steyr","stayr","steier"],lat:48.0405,lng:14.4212,
  sources:[
   {n:"Schwarz auf Weiss, Steyr Mehlspeisenrundgang",k:"German travel journalism",
    b:"A long-form pastry walk through Steyr that names each shop, its owner and the building it sits in, rather than listing addresses.",
    note:"It is the only source found that documents the Steyrer Torte, the Froschel and the Schnalle at all. Everything city-exclusive in this pack comes from it.",
    u:"https://www.schwarzaufweiss.de/oesterreich/steyr-kulinarisch.htm"},
   {n:"Oberösterreich Tourismus",k:"Official regional tourism board",
    b:"The province's own kitchen pages, where each regional recipe is credited to a specific named restaurant rather than written anonymously.",
    note:"That crediting is why Knapp am Eck appears here: the board picked one kitchen in the whole province as its Grammelknödel source.",
    u:"https://www.oberoesterreich.at/kulinarik/rezepte/spezialitaeten-aus-oesterreich-typische-rezepte-aus-oberoesterreich.html"},
   {n:"Local word of mouth",k:"Unverified, included on request",
    b:"One entry here comes from local recommendation rather than published food writing, and is marked Locals' pick.",
    note:"It is not an Austrian speciality and does not belong in the canon, but people in Steyr rate it, which is its own kind of useful.",
    u:""}],
  gap:"Two published sources, which is what a city of 38,000 yields. MeinBezirk's local Geheimtipps column was identified as a third but not read. The sweet side is far better covered than the savoury side, and that imbalance sits in the sources, not in the ranking.",
  items:[
   {d:"Steyrer Torte",vn:"Steyrer Torte",cat:"Cake",tier:"must",veg:1,only:1,place:"Café Konditorei Schmidt",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg",addr:"Stadtplatz 1, 4400 Steyr",
    what:"Chocolate torte with nuts and redcurrant jam on shortcrust, at 70 percent cocoa. Sold in a box printed with the confluence of the Steyr and the Enns.",
    order:"A slice in the café, or the whole torte boxed to carry.",
    why:"Invented by the current owner about fifteen years ago. The Schmidt family has held the house 85 years and is in its third generation. The name is unprotected, so any confectioner may make one, but this is where it started.",
    warn:"Closed Monday and Sunday.",src:1,alts:[]},
   {d:"Froschel",vn:"Froschel / Froscherl",cat:"Cake",tier:"must",veg:1,only:1,place:"Café Konditorei Schmidt",pid:"ChIJNQNDAvjFc0cR0tM1d3vPoMg",addr:"Stadtplatz 1, 4400 Steyr",
    what:"A violently green sand-cake with cherry buttercream under sugar fondant. The colour is the point and it is not subtle.",
    order:"Ask by name. It is a local word, not a menu category.",why:"The current owner's grandfather brought the idea back from Wiesbaden and France. Found nowhere outside Steyr.",
    warn:"Closed Monday and Sunday.",src:1,alts:[]},
   {d:"Steyrer Schnalle",vn:"Steyrer Schnalle",cat:"Sweet",tier:"must",veg:1,only:1,place:"Bäckerei Fröhlich, Lebzelterhaus",pid:"ChIJfaez4_jFc0cRzgrXFFyFzgI",addr:"Kirchengasse 20, Steyrdorf",
    what:"A chocolate taler of marzipan, dark chocolate and Dirndl jam, made from cornelian cherries. Named for the toll once charged at the Schnallentor.",
    order:"Ask at the counter by name.",
    why:"Made by master baker Rainer Fröhlich in the Lebzelterhaus, a building going back to the 16th century where wax candles were drawn and Lebkuchen baked. A city exclusive named after a city gate.",
    warn:"The map pin may land on the Stadtplatz 28 branch. The Lebzelterhaus is Kirchengasse 20. Check before walking.",src:1,alts:[]},
   {d:"Essbare Dachschindeln",vn:"essbare Dachschindeln",cat:"Snack",tier:"must",veg:1,only:1,place:"Bäckerei Fröhlich, Lebzelterhaus",pid:"ChIJfaez4_jFc0cRzgrXFFyFzgI",addr:"Kirchengasse 20, Steyrdorf",
    what:"Edible roof shingles. A savoury oval crispbread, long and curved like the shingles on the old town roofs.",
    order:"Savoury, not sweet. Better with beer than coffee.",why:"Rainer Fröhlich's own invention, sold nowhere else.",
    warn:"The pin may show the Stadtplatz branch rather than the Lebzelterhaus.",src:1,alts:[]},
   {d:"Grammelknödel",vn:"Grammelknödel",cat:"Dumpling",tier:"must",veg:0,place:"Wirtshaus Knapp am Eck",pid:"ChIJ1YyynPnFc0cRzUhd1EYZ3nA",addr:"Wehrgrabengasse 15, 4400 Steyr",
    what:"Potato-dough dumplings filled with Grammeln, the crisp scratchings left after rendering lard. Usually with sauerkraut.",
    order:"The menu runs to one page, which makes choosing fast.",
    why:"The provincial tourism board credits its Grammelknödel recipe to this kitchen specifically, which is a whole province singling out one house.",
    warn:"Closed Monday and Sunday, and shut between 14:00 and 18:00.",src:1,alts:[]},

'  names it into "quote".\n'+
'- If no source names a place, set "place" to null. Do NOT invent a plausible\n'+
'  shop name and do NOT write "ask locally". A null is useful. A guess is not.\n'+
'- "alts" may hold up to 3 further named places for the same dish.\n\n'+
'STEP 5 - HOW LOCAL IS IT\n'+
'"only": true only when the dish is specific to THIS city or its district and a\n'+
'  source says so. Not "regional". Not "national".\n'+
'"local": true when local people treat this particular place as their own pick.\n'+
'"reg": a short origin note when the dish comes from a nearby town, for example\n'+
'  "from Atreyapuram, 30 km".\n\n'+
'STEP 6 - WHICH TAB\n'+
'"must"  exclusive to this city or district AND you found somewhere here to eat\n'+
'        it. Be strict. A short true must-try list is the point of this app.\n'+
'"trip"  exclusive to a town within about 100 km with nowhere here selling it.\n'+
'        Put the town and the distance in "reg".\n'+
'"worth" everything else worth eating.\n\n'+
'STEP 7 - THE HONESTY RULES, WHICH MATTER MOST\n'+
'- "veg": 1 only if a source states it is vegetarian. 0 if it contains meat,\n'+
'  fish, egg or animal fat. null if no source says. Never guess. A wrong\n'+
'  "vegetarian" is the one mistake in a food app that can actually hurt someone.\n'+
'- "src": 2 if two or more INDEPENDENT sources, on different websites, support\n'+
'  the dish and its place. 1 if only one. Reprints of one article count once.\n'+
'- Omit any field you cannot support. An absent field is handled. An invented\n'+
'  one is a lie this app will display as fact.\n'+
'- Never categorise a dish by a word that merely appears in its description.\n'+
'  "Idli is a rice cake" describes texture. Idli is a steamed breakfast dish and\n'+
'  "cat" must say so, not "Cake".\n\n'+
'OUTPUT - RAW JSON ONLY\n'+
'No markdown, no code fence, no commentary before or after. Start with { and end\n'+
'with }. Use exactly this shape:\n'+
'{"name":"City as locals write it",\n'+
' "placeNote":"district, country, and which city you picked if ambiguous",\n'+
' "lang":"local language name",\n'+
' "items":[{"d":"Dish name","vn":"name in the local script, or same as d",\n'+
'   "cat":"short food-type label in this cuisine\'s own words, e.g. Sweet, Tiffin, Dumpling, Bread, Drink, Breakfast",\n'+
'   "tier":"must|worth|trip","only":true,"local":false,"reg":"",\n'+
'   "veg":1,"what":"one sentence on what it actually is",\n'+
'   "order":"one sentence on how to order it or which version to get",\n'+
'   "place":"the named shop, or null","addr":"street or area, or null",\n'+
'   "why":"one sentence on why this place and not another",\n'+
'   "quote":"the sentence from the source that names this place",\n'+
'   "srcUrls":["https://...","https://..."],"src":2,\n'+
'   "warn":"anything to watch out for, or omit",\n'+
'   "seas":"season name if seasonal, or omit",\n'+
'   "alts":[{"n":"another named place","d":"street or area"}]}],\n'+
' "sources":[{"n":"Publication name","k":"what kind of source it is, and its language",\n'+
'   "b":"one sentence on what it is and why it is worth trusting","u":"https://..."}],\n'+
' "gap":"one sentence on what this lookup could not establish"}\n\n'+
'Write "what", "order", "why", "b" and "gap" in '+uiLang+'. Keep every dish name\n'+
'and place name in the local language. Return the JSON and nothing else.';
}

/* ────────────── JSON OUT OF A MODEL, WHATEVER STATE IT ARRIVES IN ──────────────
   Three things go wrong in practice and all three are recoverable:
     1. it is wrapped in a ```json fence
     2. a sentence sits before or after it
     3. it is CUT OFF because the answer hit the output limit
   The third is the one that matters. A truncated list of 22 good dishes beats
   an error page, so the complete objects are salvaged and the half-written
   tail is dropped. */
function extractJSON(raw){
  if(!raw||typeof raw!=="string")return null;
  let s=raw.trim().replace(/^﻿/,"");
  const fence=s.match(/```(?:json|JSON)?\s*([\s\S]*?)```/);
  if(fence)s=fence[1].trim();
  else s=s.replace(/^```(?:json|JSON)?\s*/,"").replace(/```\s*$/,"").trim();

  if(s[0]==="["){ try{const a=JSON.parse(s); if(Array.isArray(a))return{items:a};}catch(e){} }

  const a=s.indexOf("{"); if(a<0)return null;
  const b=s.lastIndexOf("}");
  try{ return JSON.parse(b>a?s.slice(a,b+1):s.slice(a)); }catch(e){}
  const sv=salvage(s.slice(a));
  if(sv){ try{ return JSON.parse(sv); }catch(e){} }
  return null;
}
/* Rebuild the largest valid prefix of a truncated object. */
function salvage(s){
  let inStr=false,escp=false,depth=0,arr=0,lastItem=-1,itemsAt=-1;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(escp){escp=false;continue;}
    if(c==="\\"){ if(inStr)escp=true; continue; }
    if(c==='"'){ inStr=!inStr; continue; }
    if(inStr)continue;
    if(c==="{"||c==="["){
      if(c==="["&&itemsAt<0){
        const before=s.slice(Math.max(0,i-14),i).replace(/\s/g,"");
        if(/"items":$/.test(before))itemsAt=i;
      }
      if(c==="{")depth++;else arr++;
    }else if(c==="}"||c==="]"){
      if(c==="}")depth--;else arr--;
      /* An ITEM closes at depth 1 inside exactly 1 open array. Objects nested
         inside an item close at depth 2 or deeper and must not be mistaken for
         it, or the salvage would cut an item in half. */
      if(c==="}"&&itemsAt>=0&&depth===1&&arr===1)lastItem=i;
    }
  }
  if(itemsAt<0||lastItem<0)return null;
  return s.slice(0,lastItem+1)+"]}";
}

/* ────────────── NOTHING REACHES THE UI UNCHECKED ────────────── */
const sstr=v=>(typeof v==="string"&&v.trim())?v.trim():null;
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return null;}};

function normalise(pack,city,grounded){
  if(!pack||typeof pack!=="object")return null;
  const raw=Array.isArray(pack.items)?pack.items
           :Array.isArray(pack.dishes)?pack.dishes
           :Array.isArray(pack.list)?pack.list
           :Array.isArray(pack)?pack:[];
  const seen=Object.create(null), items=[];

  for(const r of raw){
    if(!r||typeof r!=="object")continue;
    const d=sstr(r.d)||sstr(r.name)||sstr(r.dish);
    if(!d)continue;
    const dk=d.toLowerCase(); if(seen[dk])continue; seen[dk]=1;

    /* Source count is computed from distinct websites, never taken from the
       model's own "src". Two links to one paper is one source. */
    const urls=Array.isArray(r.srcUrls)?r.srcUrls.map(sstr).filter(Boolean):[];
    const hs=[]; for(const u of urls){const h=hostOf(u); if(h&&hs.indexOf(h)<0)hs.push(h);}
    let src=hs.length>=2?2:(hs.length===1?1:0);
    if(!src&&(r.src===1||r.src===2)&&sstr(r.quote))src=1;

    const place=sstr(r.place), quote=sstr(r.quote);
    const it={d,vn:sstr(r.vn)||d,cat:sstr(r.cat)||"Other",
      tier:(r.tier==="must"||r.tier==="trip"||r.tier==="worth")?r.tier:"worth",
      only:r.only===true?1:0, local:r.local===true?1:0,
      what:sstr(r.what)||"", order:sstr(r.order)||"", why:sstr(r.why)||"", src};
    if(place){it.place=place; it.addr=sstr(r.addr)||"";}
    if(quote)it.quote=quote;
    if(sstr(r.reg))it.reg=sstr(r.reg);
    if(sstr(r.warn))it.warn=sstr(r.warn);
    if(sstr(r.seas))it.seas=sstr(r.seas);
    it.veg=(r.veg===1||r.veg===true)?1:(r.veg===0||r.veg===false)?0:null;
    if(urls.length)it.srcUrls=urls.slice(0,4);
    /* Must-try is earned, not claimed: exclusive AND somewhere here to eat it */
    if(it.tier==="must"&&!(it.only&&it.place))it.tier="worth";
    it.alts=Array.isArray(r.alts)?r.alts.map(x=>{
      if(!x||typeof x!=="object")return null;
      const n=sstr(x.n)||sstr(x.name); if(!n)return null;
      return {n,d:sstr(x.d)||sstr(x.addr)||""};
    }).filter(Boolean).slice(0,3):[];
    items.push(it);
  }
  if(!items.length)return null;

  /* The sources list shows the pages Google Search actually opened. Those are
     real by construction. Anything the model merely named goes after them. */
  const sources=[], sh=Object.create(null);
  for(const g of (grounded||[])){
    const h=hostOf(g.uri)||sstr(g.title)||"source";
    if(sh[h])continue; sh[h]=1;
    sources.push({n:sstr(g.title)||h,k:t("srcRead"),b:t("srcReadB"),u:g.uri});
    if(sources.length>=12)break;
  }
  for(const s of (Array.isArray(pack.sources)?pack.sources:[])){
    if(!s||typeof s!=="object")continue;
    const n=sstr(s.n); if(!n)continue;
    const h=hostOf(s.u)||n; if(sh[h])continue; sh[h]=1;
    sources.push({n,k:sstr(s.k)||t("srcNamed"),b:sstr(s.b)||"",u:sstr(s.u)||""});
    if(sources.length>=16)break;
  }
  /* The gap line explains how this list was built and what it could not
     establish. The method half is ours; the model only supplies the half
     about what it personally could not find. */
  const gap=[t("liveGap4"),sstr(pack.gap)].filter(Boolean).join(" ");
  return {name:sstr(pack.name)||city,live:1,aka:[String(city).toLowerCase()],
          lat:null,lng:null,placeNote:sstr(pack.placeNote)||"",lang:sstr(pack.lang)||"",
          sources,gap,items};
}

/* ────────────── WHY IT FAILED, IN WORDS THAT LEAD TO A FIX ────────────── */
function classify(status,body){
  const msg=((body&&body.error&&body.error.message)||"").toLowerCase();
  const st=((body&&body.error&&body.error.status)||"").toUpperCase();
  if(status===400&&/api[ _-]?key|api key not valid/.test(msg))return "badkey";
  if(status===401||status===403){
    if(/grounding|google[ _]search|search tool|not supported|not available|billing|billed/.test(msg))return "noground";
    return "forbidden";
  }
  if(status===404)return "nomodel";
  if(status===429||st==="RESOURCE_EXHAUSTED")return "quota";
  if(status>=500)return "server";
  if(status===400){
    if(/grounding|google[ _]search|search tool|tool.*not|unsupported|not available|billing/.test(msg))return "noground";
    if(/unknown name|invalid json|cannot find field|unrecognized/.test(msg))return "badfield";
    return "badreq";
  }
  return "other";
}

/* ────────────── ONE REQUEST ──────────────
   Auth goes in the query string, which keeps the request to a single custom
   header. That matters: a browser preflights any custom header, and a header
   the server does not list in Access-Control-Allow-Headers fails the whole
   call before it leaves the phone. If the query form is ever refused, the
   header form is tried once. */
async function askGemini(model,prompt,useHeader){
  const url=GEM+model+":generateContent"+(useHeader?"":"?key="+enc(S.gkey));
  const headers={"Content-Type":"application/json"};
  if(useHeader)headers["x-goog-api-key"]=S.gkey;

  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),TIMEOUT_MS);
  let res;
  try{
    res=await fetch(url,{method:"POST",headers,signal:ctl.signal,
      body:JSON.stringify({
        contents:[{role:"user",parts:[{text:prompt}]}],
        tools:[{google_search:{}}],
        generationConfig:{temperature:0.3,maxOutputTokens:46000}
      })});
  }catch(e){
    clearTimeout(timer);
    if(e&&e.name==="AbortError")throw{kind:"timeout"};
    throw{kind:"network"};          /* CORS, offline, DNS: all land here */
  }
  clearTimeout(timer);

  let body=null;
  try{ body=await res.json(); }catch(e){}
  if(!res.ok)throw{kind:classify(res.status,body),status:res.status,
                   detail:(body&&body.error&&body.error.message)||""};

  const cand=(body&&body.candidates&&body.candidates[0])||null;
  if(!cand)throw{kind:"empty",detail:(body&&body.promptFeedback&&body.promptFeedback.blockReason)||""};

  const parts=(cand.content&&cand.content.parts)||[];
  const text=parts.map(p=>p&&p.text).filter(Boolean).join("");
  const gm=cand.groundingMetadata||{};
  const chunks=(gm.groundingChunks||[]).map(c=>c&&c.web).filter(Boolean);
  return {text,chunks,
          queries:gm.webSearchQueries||[],
          entry:(gm.searchEntryPoint&&gm.searchEntryPoint.renderedContent)||"",
          truncated:cand.finishReason==="MAX_TOKENS"};
}

/* ────────────── THE LOOKUP, WITH ITS FALLBACKS ────────────── */
async function liveLookup(city,step){
  const cached=readCache(city);
  if(cached){ step(0,"ok",t("fromCache")); step(1,"ok",cached.items.length+" "+t("items")); return cached; }

  if(!S.gkey){ throw{soft:t("needkey")}; }

  const prompt=buildPrompt(city,uiLangName());
  const order=[S.model].concat(MODELS.map(m=>m.id).filter(id=>id!==S.model));
  const t0=Date.now();
  const tick=setInterval(()=>{
    const s=Math.round((Date.now()-t0)/1000);
    step(0,"run",t("searching")+" "+s+"s");
  },1000);
  step(0,"run",t("searching")+" 0s");

  let lastErr=null, groundFails=0;
  try{
    for(let i=0;i<order.length;i++){
      const model=order[i];
      for(let attempt=0;attempt<2;attempt++){
        try{
          const r=await askGemini(model,prompt,attempt===1);
          clearInterval(tick);
          step(0,"ok",(r.queries.length?r.queries.length+" "+t("searches"):t("done"))+" · "+model);
          step(1,"run","");
          const parsed=extractJSON(r.text);
          if(!parsed)throw{kind:"nojson",truncated:r.truncated};
          const pack=normalise(parsed,city,r.chunks);
          if(!pack)throw{kind:"noitems"};
          pack.model=model;
          pack.entry=r.entry;
          pack.truncated=r.truncated?1:0;
          pack.ts=Date.now();
          step(1,"ok",pack.items.length+" "+t("items"));
          step(2,"run","");
          writeCache(city,pack);
          return pack;
        }catch(e){
          lastErr=e;
          const k=e&&e.kind;
          /* a failed query-string auth is worth one retry with the header */
          if(k==="network"&&attempt===0)continue;
          if(k==="badkey"||k==="forbidden"){ clearInterval(tick); throw{soft:msgFor(e)}; }
          if(k==="server"&&attempt===0){ await wait(1500); continue; }
          if(k==="noground"){ groundFails++; break; }   /* try the next model */
          if(k==="nomodel"||k==="quota"||k==="badreq"||k==="badfield")break;
          if(k==="nojson"||k==="noitems"||k==="empty"||k==="timeout"){ clearInterval(tick); throw{soft:msgFor(e)}; }
          break;
        }
      }
    }
  }finally{ clearInterval(tick); }
  if(groundFails>=order.length)throw{soft:t("eNoGroundAll")};
  throw{soft:msgFor(lastErr)};
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
function msgFor(e){
  const k=e&&e.kind;
  if(k==="badkey")   return t("eBadKey");
  if(k==="forbidden")return t("eForbidden")+(e.detail?" ("+e.detail+")":"");
  if(k==="noground") return t("eNoGround");
  if(k==="nomodel")  return t("eNoModel");
  if(k==="quota")    return t("eQuota");
  if(k==="server")   return t("eServer");
  if(k==="timeout")  return t("eTimeout");
  if(k==="network")  return t("eNetwork");
  if(k==="nojson")   return e.truncated?t("eTrunc"):t("eNoJson");
  if(k==="noitems")  return t("eNoItems");
  if(k==="empty")    return t("eEmpty")+(e.detail?" ("+e.detail+")":"");
  if(k==="badfield"||k==="badreq")return t("eBadReq")+(e.detail?" ("+e.detail+")":"");
  return t("lfail");
}
function uiLangName(){ const f=LANGS.find(l=>l[0]===L); return f?f[1]+" ("+L+")":"English"; }

/* ────────────── CACHE ──────────────
   A finished pack holds editorial facts, which do not change week to week.
   The key carries a version so that changing the prompt drops every stored
   pack at once. The 12-minute-stale Linz result came from not doing this. */
function cacheKey(city){ return "fb2.pack."+CACHE_V+"."+String(city).toLowerCase().trim(); }
function readCache(city){
  try{
    const r=localStorage.getItem(cacheKey(city)); if(!r)return null;
    const p=JSON.parse(r);
    if(!p||!p.items||!p.items.length)return null;
    if(Date.now()-(p.ts||0)>CACHE_DAYS*864e5){ localStorage.removeItem(cacheKey(city)); return null; }
    return p;
  }catch(e){ return null; }
}
function writeCache(city,pack){
  try{ localStorage.setItem(cacheKey(city),JSON.stringify(pack)); }
  catch(e){ try{ /* storage full: clear our own packs and try once more */
    Object.keys(localStorage).filter(k=>k.indexOf("fb2.pack.")===0).forEach(k=>localStorage.removeItem(k));
    localStorage.setItem(cacheKey(city),JSON.stringify(pack));
  }catch(e2){} }
}

/* ═══════════════════════════════════════════════════════════════════════
   PACK CONTRACT — what both paths produce and the UI consumes

   { name, live:1, aka:[], sources:[{n,k,b,note,u}], gap:"",
     items:[ { d, vn, cat, tier, only, local, reg, seas, months, veg,
               what, order, why, warn, quote, src, place, placeTxt, addr,
               pid, lat, lon, alts:[{n,d,pid,lat,lon}] } ] }
   The fields that drive this UI:
     tier   "must" | "worth" | "trip"    which tab it lands in
     only   1 when exclusive to this city or district
     src    2 = two independent sites, 1 = one, 0 = unverified
     quote  the sentence from the source that named the place
     pid    Google Place ID when known  -> exact business card
     lat/lon shop coordinates           -> directions to the exact point
   Anything a lookup cannot verify it simply omits. Nothing here invents a
   fallback for a missing field.
   ═══════════════════════════════════════════════════════════════════════ */

let L="en"; const t=k=>(T[L]&&T[L][k])||T.en[k]||"";

const S={pack:null,key:null,tab:"must",veg:false,done:{},
         gkey:"",model:MODELS[0].id,remember:true};
try{
  const l=localStorage.getItem("fb2.lang"); if(l&&T[l])L=l;
  S.done=JSON.parse(localStorage.getItem("fb2.done")||"{}")||{};
  const tb=localStorage.getItem("fb2.tab"); if(tb)S.tab=tb;
  const gk=localStorage.getItem("fb2.gkey"); if(gk){S.gkey=gk;}
  const md=localStorage.getItem("fb2.model"); if(md&&MODELS.some(m=>m.id===md))S.model=md;
}catch(e){}
const save=(k,v)=>{try{localStorage.setItem("fb2."+k,v)}catch(e){}};

const inSeas=it=>!!it.months&&it.months.indexOf(MON)>-1;
function ago(ts){
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return t("justnow");
  if(m<60)return m+" "+t("minago");
  const h=Math.floor(m/60); if(h<24)return h+" "+t("hrago");
  return Math.floor(h/24)+" "+t("dayago");
}
const kk=it=>it.d+"|"+(it.place||it.placeTxt||"");
const app=document.getElementById("app");
let REG=[];
const vis=()=>(S.pack?S.pack.items:[]).filter(it=>!(S.veg&&it.veg!==1));

/* ── LINKS. Spec 5.3 and 7.3. Both bugs you reported are fixed here. ── */

/* A name in `query` is a text search, which is how one Siddhi Sweet Shop
   became seven. Coordinates pin one point. A Place ID pins one business.  */
function mapHref(o){
  if(o.pid) return "https://www.google.com/maps/search/?api=1&query="+enc(o.place||o.n||"")+"&query_place_id="+o.pid;
  if(o.lat!=null&&o.lon!=null) return "https://www.google.com/maps/dir/?api=1&destination="+o.lat+","+o.lon;
  return null;
}
/* Dish plus PLACE name. Never the shop name. A local-script name is used
   alone when it exists, because it finds what local people photographed. */
function photoHref(it,city){
  const localScript = it.vn && it.vn!==it.d && /[^\u0000-ɏ]/.test(it.vn);
  return "https://www.google.com/search?tbm=isch&q="+enc(localScript ? it.vn : (it.d+" "+city));
}

/* ── VERIFICATION, spec 8 ── */
function verTag(it){
  if(it.src>=2) return ["ver",t("ver")];
  if(it.src===1) return ["one",t("one")];
  return null;
}
function tagsFor(it){
  const g=[];
  if(it.only)g.push(["only",t("only")]);
  if(it.local)g.push(["local",t("local")]);
  const v=verTag(it); if(v)g.push(v);
  if(it.seas&&inSeas(it))g.push(["seas",t("inseas")]);
  else if(it.seas)g.push(["off",it.seas]);
  if(it.reg)g.push(["reg",it.reg]);
  return g.length?`<div class="tags">${g.map(([c,x])=>`<span class="tg ${c}">${esc(x)}</span>`).join("")}</div>`:"";
}

/* ── THE KEY PANEL ──
   Shown open until a key exists, then collapsed to one line. The key is
   never written into this file, only into this browser. */
function wireKey(){
  const sv=document.getElementById("ksave");
  if(sv){
    const take=()=>{
      const el=document.getElementById("kin"), err=document.getElementById("kerr");
      const v=(el.value||"").trim().replace(/\s+/g,"");
      if(!v){ el.focus(); return; }
      /* a soft check only. Google decides; this just catches an obvious paste
         of the wrong thing before spending a request on it. */
      if(v.length<20||v.indexOf("AIza")!==0){ err.textContent=t("kBad"); }
      else err.textContent="";
      S.gkey=v; save("gkey",v); hello();
    };
    sv.addEventListener("click",take);
    document.getElementById("kin").addEventListener("keydown",e=>{if(e.key==="Enter")take();});
  }
  const ch=document.getElementById("kchg");
  if(ch)ch.addEventListener("click",()=>{S.gkey="";hello();});
  const dl=document.getElementById("kdel");
  if(dl)dl.addEventListener("click",()=>{
    S.gkey=""; try{localStorage.removeItem("fb2.gkey");}catch(e){} hello();});
  const ms=document.getElementById("msel");
  if(ms)ms.addEventListener("change",e=>{S.model=e.target.value;save("model",S.model);});
}

    <div class="kh">${esc(t("kH"))}</div>
    <p class="kb">${esc(t("kB"))}</p>
    <a class="kget" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">${esc(t("kGet"))} →</a>
    <div class="typer"><input id="kin" type="password" placeholder="${esc(t("kPh"))}"
       autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text">
      <button id="ksave">${esc(t("kSave"))}</button></div>
    <p class="kerr" id="kerr"></p></div>`;
}

/* ── WELCOME ── */
function hello(){
  app.innerHTML=`<div class="hello">
    <div class="brand">First Bite</div>
    <h1>${esc(t("greet"))}</h1>
    <p class="say">${esc(t("say"))}</p>
    <div class="lang"><select id="lsel" aria-label="${esc(t("lang"))}">
      ${LANGS.map(([k,n])=>`<option value="${k}"${k===L?" selected":""}>${esc(n)}</option>`).join("")}</select></div>
    <p class="lnote">${esc(t("lnote"))}</p>
    <button class="big" id="geo">${esc(t("loc"))}</button>
    <div class="typer"><input id="cin" placeholder="${esc(t("tph"))}" autocomplete="off" autocapitalize="words">
      <button id="cgo">${esc(t("go"))}</button></div>
    ${keyPanel()}
    <div class="orr">${esc(t("or"))}</div>
    ${Object.keys(PACKS).map(k=>{const n=PACKS[k].items.length,o=PACKS[k].items.filter(i=>i.only).length;
      return `<button class="pickbtn" data-k="${k}"><span class="pn">${esc(PACKS[k].name)}</span>
        <span class="pd">${n} ${esc(t("items"))}${o?" · "+o+" 📍":""}</span></button>`}).join("")}
    <p class="hnote" id="hnote"></p></div>`;
  wireKey();
  document.getElementById("lsel").addEventListener("change",e=>{L=e.target.value;save("lang",L);hello();});
  document.getElementById("geo").addEventListener("click",()=>{
    const n=document.getElementById("hnote");
    if(!navigator.geolocation){n.textContent=t("lfail");return;}
    n.textContent="…";
    navigator.geolocation.getCurrentPosition(p=>{
      const near=Object.keys(PACKS).map(k=>[k,Math.hypot(p.coords.latitude-PACKS[k].lat,(p.coords.longitude-PACKS[k].lng)*0.67)])
        .sort((a,b)=>a[1]-b[1])[0];
      if(near[1]<1.1)start(near[0],PACKS[near[0]].name);
      else start(null,(p.coords.latitude.toFixed(3)+", "+p.coords.longitude.toFixed(3)));
    },()=>{n.textContent=t("lfail");},{enableHighAccuracy:true,timeout:9000,maximumAge:120000});});
  const typed=()=>{const raw=(document.getElementById("cin").value||"").trim();
    if(!raw)return;
    const v=raw.toLowerCase();
    const hit=Object.keys(PACKS).find(k=>PACKS[k].aka.some(a=>a.indexOf(v)===0||v.indexOf(a)===0));
    /* A researched pack and an already-cached city both work without a key.
       Only a genuinely new city needs one, so only then is the key demanded. */
    if(!hit&&!S.gkey&&!readCache(raw)){
      document.getElementById("hnote").textContent=t("needkey");
      const ki=document.getElementById("kin"); if(ki){ki.focus();ki.scrollIntoView({block:"center"});}
      return;}
    start(hit||null,hit?PACKS[hit].name:raw);};
  document.getElementById("cgo").addEventListener("click",typed);
  document.getElementById("cin").addEventListener("keydown",e=>{if(e.key==="Enter")typed();});
  app.querySelectorAll(".pickbtn").forEach(b=>b.addEventListener("click",()=>start(b.dataset.k,PACKS[b.dataset.k].name)));
}

/* ── THREE-STAGE LOADER ── */
function start(packKey,label){
  const names=[t("st1"),t("st2"),t("st3")];
  app.innerHTML=`<div class="load"><div class="lc">First Bite</div><h2>${esc(label)}</h2>
    <div class="steps">${names.map((n,i)=>
      `<div class="step" id="s${i}"><span class="stit">${SV.tick}</span>
        <span class="sbody"><span class="slbl">${esc(n)}</span><span class="ssub" id="u${i}"></span></span></div>`).join("")}</div>
    <div id="lout"></div></div>`;
  const step=(i,st,sub)=>{const e=document.getElementById("s"+i);if(!e)return;
    e.className="step "+(st==="ok"?"ok":st==="err"?"err":"run");
    const u=document.getElementById("u"+i); if(u&&sub!=null)u.textContent=sub;};
  const stop=(i,msg)=>{step(i,"err");
    document.getElementById("lout").innerHTML=
      `<p class="lerr">${esc(msg)}</p><button class="lback" id="lb">${esc(t("lback"))}</button>`;
    document.getElementById("lb").addEventListener("click",hello);};

  if(packKey&&PACKS[packKey]){
    const P=PACKS[packKey];
    step(0,"run","…");
    setTimeout(()=>{step(0,"ok",P.sources.map(s=>s.k).join(" · "));
      step(1,"run",P.items.length+" "+t("items"));
      setTimeout(()=>{step(1,"ok",P.items.length+" "+t("items"));
        step(2,"run","");
        setTimeout(()=>{step(2,"ok","");
          S.pack=P;S.key=packKey;REG=P.items;
          setTimeout(render,260);},300);},300);},320);
    return;
  }

  /* Live city. One grounded call on the reader's own key. */
  liveLookup(label,step).then(p=>{
    step(2,"ok","");
    S.pack=p;S.key=(p.name||label).toLowerCase();REG=p.items;
    setTimeout(render,300);
  }).catch(err=>{
    /* Anything thrown as {soft:...} is a sentence meant for a person. A bare
       exception is a bug in this file, and saying so is more useful than
       pretending the network failed. */
    const m=(err&&err.soft)||(err&&err.message?("Unexpected error: "+err.message):t("lfail"));
    stop(err&&err.soft?1:0,m);
    if(!(err&&err.soft)&&window.console)console.error("First Bite:",err);
  });
}

/* ── RENDER ── */
const TABS=[["must","sMust"],["worth","sWorth"],["trip","sTrip"],["all","sAll"]];
const listFor=(tab,items)=> tab==="all"
  ? items.slice().sort((a,b)=>a.d.localeCompare(b.d))
  : items.filter(i=>i.tier===tab);

function rowHTML(it){
  const i=REG.indexOf(it), on=!!S.done[kk(it)];
  const mh=mapHref(it);
  const where = it.place ? esc(it.place)+(it.addr?", "+esc(it.addr):"")
                         : `<span class="nosrc">${esc(it.placeTxt||t("noshop"))}</span>`;
  return `<div class="row ${on?"done":""}" data-i="${i}"><div class="rmain">
    <button class="tick" data-tk="${i}" aria-label="${esc(t("doneM"))}"><i>${SV.tick}</i></button>
    <div class="rtext"><div class="dish">${esc(it.d)}</div>
      ${it.vn&&it.vn!==it.d?`<div class="vn">${esc(it.vn)}</div>`:""}
      <div class="place">${where}</div>
      ${tagsFor(it)}</div>
    <div class="acts">
      ${mh?`<a class="act" href="${esc(mh)}" target="_blank" rel="noopener" aria-label="Map">${SV.pin}</a>`:""}
      <button class="act bi" data-i="${i}" aria-label="Info">${SV.info}</button>
      <button class="act bv" data-i="${i}" aria-label="Alt">${SV.chev}</button></div>
  </div><div class="alts" hidden></div></div>`;
}
function grouped(list){
  const order=[],by={};
  list.forEach(it=>{const c=it.cat||"Other";if(!by[c]){by[c]=[];order.push(c);}by[c].push(it);});
  return order.map(c=>`<div class="type">${esc(c)}</div>`+by[c].map(rowHTML).join("")).join("");
}

function render(){
  const P=S.pack; if(!P){hello();return;}
  const items=vis(); REG=P.items;
  const must=items.filter(i=>i.tier==="must");
  const dOf=a=>a.filter(i=>S.done[kk(i)]).length;
  const pM=must.length?Math.round(dOf(must)/must.length*100):0;
  const pA=items.length?Math.round(dOf(items)/items.length*100):0;
  if(!listFor(S.tab,items).length){
    const alt=TABS.map(x=>x[0]).find(k=>listFor(k,items).length);
    if(alt)S.tab=alt;}
  const list=listFor(S.tab,items);
  app.innerHTML=`
  <div class="mast"><h1>${esc(t("title"))} ${esc(P.name)}</h1><button class="chg" id="chg">${esc(t("chg"))}</button></div>
  <div class="prov"><span class="pvt ${P.live?"lv":"cur"}">${esc(P.live?t("livep"):t("curated"))}</span>
    ${P.live&&P.ts?`<span class="pvw">${esc(t("updated"))} ${esc(ago(P.ts))}</span>
      <button class="klink" id="rfr">${esc(t("refresh"))}</button>`:""}
    ${P.live&&P.model?`<span class="pvw">${esc(t("gModel"))} ${esc(P.model)}</span>`:""}</div>
  ${P.truncated?`<p class="trunc">${esc(t("gTrunc"))}</p>`:""}
  <div class="mx">
    <div class="mxc only"><div class="mxh"><span class="em">📍</span>${esc(t("excl"))}</div><div class="mxn">${items.filter(i=>i.only).length}</div></div>
    <div class="mxc"><div class="mxh"><span class="em">😋</span>${esc(t("mustM"))}</div><div class="mxn">${must.length}</div></div>
    <div class="mxc"><div class="mxh">${esc(t("doneM"))}</div><div class="halves">
      <div class="half"><div class="hn">${pM}%</div><div class="hk">${esc(t("hMust"))}</div><div class="hbar"><i style="width:${pM}%"></i></div></div>
      <div class="half"><div class="hn">${pA}%</div><div class="hk">${esc(t("hAll"))}</div><div class="hbar"><i style="width:${pA}%"></i></div></div>
    </div></div>
  </div>
  <div class="tabs">${TABS.map(([k,lbl])=>
    `<button class="tb" data-tab="${k}" aria-pressed="${k===S.tab}">${esc(t(lbl))}<b>${listFor(k,items).length}</b></button>`).join("")}</div>
  <div class="tools"><button class="tool" id="vegF" aria-pressed="${S.veg}">${esc(t("veg"))}</button></div>
  <div class="sec">${list.length?(S.tab==="all"?list.map(rowHTML).join(""):grouped(list))
    :`<p class="empty">${esc(S.tab==="trip"?t("noTrip"):"—")}</p>`}</div>
  <div class="srcs"><h2>${esc(t("srcH"))}</h2>
    ${P.sources.map(s=>`<div class="sitem"><div class="sn">${esc(s.n)}</div><div class="sk">${esc(s.k)}</div>
      <div class="sb">${esc(s.b)}</div>${s.note?`<div class="sb">${esc(s.note)}</div>`:""}
      ${s.u?`<a class="sl" href="${esc(s.u)}" target="_blank" rel="noopener">${esc(t("opensrc"))}</a>`:""}</div>`).join("")}
    <p class="cav">${esc(P.gap||"")}</p><p class="cav">${esc(t("cav"))}</p>
    ${P.entry?`<div class="gse"><div class="eb">${esc(t("gSugg"))}</div><div id="gseBox"></div></div>`:""}</div>`;
  /* Google's terms require the Search Suggestions block to be displayed with
     a grounded answer. It arrives as ready-made HTML and CSS from Google's
     own API over HTTPS, so it is inserted as given rather than escaped. */
  if(P.entry){ const box=document.getElementById("gseBox"); if(box)box.innerHTML=P.entry; }
  const rf=document.getElementById("rfr");
  if(rf)rf.addEventListener("click",()=>{
    const city=P.name;
    try{localStorage.removeItem(cacheKey(city));localStorage.removeItem(cacheKey(S.key||city));}catch(e){}
    S.pack=null; start(null,city); window.scrollTo(0,0);});
  document.getElementById("chg").addEventListener("click",()=>{S.pack=null;hello();window.scrollTo(0,0);});
  document.getElementById("vegF").addEventListener("click",()=>{S.veg=!S.veg;render();});
  app.querySelectorAll(".tb").forEach(b=>b.addEventListener("click",()=>{
    S.tab=b.dataset.tab;save("tab",S.tab);render();window.scrollTo(0,0);}));
}

app.addEventListener("click",e=>{
  const bi=e.target.closest(".bi"), bv=e.target.closest(".bv"), tk=e.target.closest(".tick");
  if(tk){const it=REG[+tk.dataset.tk],k=kk(it);
    if(S.done[k])delete S.done[k];else S.done[k]=1;
    save("done",JSON.stringify(S.done));render();return;}
  if(bi){sheet(REG[+bi.dataset.i]);return;}
  if(bv){const row=bv.closest(".row"),box=row.querySelector(".alts"),it=REG[+bv.dataset.i];
    if(!box.hasChildNodes()){
      box.innerHTML=(it.alts&&it.alts.length)?it.alts.map(a=>{
        const mh=mapHref(a);
        return `<div class="alt"><div class="at"><div class="an">${esc(a.n)}</div><div class="ad">${esc(a.d||"")}</div></div>
          <div class="acts">${mh?`<a class="act" href="${esc(mh)}" target="_blank" rel="noopener" aria-label="Map">${SV.pin}</a>`:""}
          <a class="act" href="${esc(photoHref({d:it.d,vn:it.vn},S.pack.name))}" target="_blank" rel="noopener" aria-label="Photos">${SV.cam}</a></div></div>`;}).join("")
        :`<div class="none">${esc(t("alts"))}</div>`;}
    const sh=box.hidden;box.hidden=!sh;bv.classList.toggle("on",sh);}
});

function sheet(it){
  const f=(l,v,c)=>v?`<div class="fld ${c||""}"><span class="eb">${l}</span><p>${esc(v)}</p></div>`:"";
  const mh=mapHref(it), ph=photoHref(it,S.pack.name);
  const d=document.createElement("div");d.className="scrim";
  d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">
    <div class="shd"><div><h3>${esc(it.d)}</h3>${it.vn&&it.vn!==it.d?`<div class="vn">${esc(it.vn)}</div>`:""}</div>
      <button class="sx" aria-label="Close">×</button></div>
    ${tagsFor(it)}
    <div class="btns">
      ${mh?`<a class="btn" href="${esc(mh)}" target="_blank" rel="noopener">${SV.nav} ${esc(t("directions"))}</a>`:""}
      <a class="btn" href="${esc(ph)}" target="_blank" rel="noopener">${SV.cam} ${esc(t("photo"))}</a>
    </div>
    ${f(esc(t("what")),it.what)}${f(esc(t("order")),it.order)}
    ${f(esc(t("where")),it.place?it.place+(it.addr?", "+it.addr:""):it.placeTxt)}
    ${f(esc(t("why")),it.why)}
    ${it.quote?`<div class="fld"><span class="eb">${esc(t("quoteL"))}</span>
      <p class="quo">${esc(it.quote)}</p>
      ${(it.srcUrls||[]).map((u,i)=>`<a class="sl" href="${esc(u)}" target="_blank" rel="noopener">${esc(hostOf(u)||t("opensrc"))}</a>`).join(" ")}</div>`:""}
    ${it.warn?`<div class="fld"><span class="eb">${esc(t("warn"))}</span><p class="red">${esc(it.warn)}</p></div>`:""}
    ${f(esc(t("howver")),it.src>=2?t("ver2"):(it.src===1?t("ver1"):t("ver0")))}
  </div>`;
  d.addEventListener("click",e=>{if(e.target===d||e.target.classList.contains("sx"))d.remove();});
  document.body.appendChild(d);
}
hello();
})();
</script>
